require_command git
require_command git-lfs
require_command nix

repo_root=$(git rev-parse --show-toplevel 2>/dev/null) ||
  fail "this directory is not a Git worktree"

physical_root=$(CDPATH= cd "$repo_root" && pwd -P)

[ "$(pwd -P)" = "$physical_root" ] ||
  fail "the setup script must run from the worktree root"

[ -f flake.nix ] ||
  fail "flake.nix is missing; this does not appear to be ORNLSlicer"

[ -f CMakePresets.json ] ||
  fail "CMakePresets.json is missing"

[ -f cmake/presets/generic-llvm-ninja.json ] ||
  fail "the generic-llvm-ninja preset is missing"

printf '%s\n' "Fetching Git LFS content..."
git lfs pull ||
  fail "Git LFS could not fetch or materialize the worktree assets"

printf '%s\n' "Preparing the ORNLSlicer Nix environment and CMake build tree..."
nix develop \
  --accept-flake-config \
  --no-write-lock-file \
  .#ornlslicerDev \
  -L \
  --command cmake --preset generic-llvm-ninja

[ -f build/generic-llvm-ninja/CMakeCache.txt ] ||
  fail "CMake completed without creating the expected cache"

printf '%s\n' "ORNLSlicer worktree setup is ready."'''

