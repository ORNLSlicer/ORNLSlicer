---
name: Nix CI
on: push
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: ./
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v29
      - run: nix flake check --all-systems

  linux:
    env:
      ci_derivation: ornl.ornlslicer
      out_link: ornlslicer.appimage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: 'true'
      - uses: cachix/install-nix-action@v27
      - name: Setup Environment
        run: echo "artifact=$(nix eval --raw .#${{ env.ci_derivation }}.name).appimage" >> $GITHUB_ENV
      - name: Compile Linux Build
        run: nix build -L .#${{ env.ci_derivation }} --accept-flake-config
      - name: Bundle Output
        run: |
          nix bundle -L --bundler .#appimage .#${{ env.ci_derivation }} -o ${{ env.out_link }}
          cp ${{ env.out_link }} ${{ env.artifact }}
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.artifact }}
          path: ${{ env.artifact }}

  windows:
    env:
      ci_derivation: windows.ornl.ornlslicer
      out_link: ornlslicer
      package_dir: ornlslicer-package
      nsis_script: scripts/installer.nsi
      WINDOWS_CODE_SIGNING_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CODE_SIGNING_CERTIFICATE_BASE64 }}
      WINDOWS_CODE_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CODE_SIGNING_CERTIFICATE_PASSWORD }}
      WINDOWS_CODE_SIGNING_DESCRIPTION: ORNLSlicer
      WINDOWS_CODE_SIGNING_PUBLISHER_URL: https://github.com/ORNLSlicer/ORNLSlicer
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: 'true'
      - uses: cachix/install-nix-action@v27
      - name: Setup Environment
        run: |
          echo "install_artifact=$(nix eval --raw .#${{ env.ci_derivation }}.name)-installer-${{ github.run_number }}.exe" >> $GITHUB_ENV
          echo "package_artifact=$(nix eval --raw .#${{ env.ci_derivation }}.name)-portable-${{ github.run_number }}" >> $GITHUB_ENV
          echo "version=$(nix eval --raw .#${{ env.ci_derivation }}.version)" >> $GITHUB_ENV
      - name: Compile Windows Build
        run: nix build -L .#${{ env.ci_derivation }} --accept-flake-config -o ${{ env.out_link }}
      - name: Stage Windows Package
        run: |
          cp -R -L ${{ env.out_link }} ${{ env.package_dir }}
          chmod -R u+w ${{ env.package_dir }}
      - name: Require Windows Signing Configuration
        run: |
          if [[ -z "${WINDOWS_CODE_SIGNING_CERTIFICATE_BASE64}" || -z "${WINDOWS_CODE_SIGNING_CERTIFICATE_PASSWORD}" ]]; then
            echo "::error title=Windows signing secrets missing::Configure WINDOWS_CODE_SIGNING_CERTIFICATE_BASE64 and WINDOWS_CODE_SIGNING_CERTIFICATE_PASSWORD repository secrets to Authenticode-sign Windows artifacts."
            exit 1
          fi
      - name: Prepare Windows Signing Certificate
        run: |
          cert_path="${RUNNER_TEMP}/windows-code-signing.pfx"
          printf '%s' "${WINDOWS_CODE_SIGNING_CERTIFICATE_BASE64}" | base64 --decode > "${cert_path}"
          chmod 600 "${cert_path}"
          echo "WINDOWS_CODE_SIGNING_CERTIFICATE_PATH=${cert_path}" >> "${GITHUB_ENV}"
      - name: Sign Windows Package Executables
        run: |
          nix develop --accept-flake-config --command \
            bash scripts/sign_windows_artifacts.sh \
              "${WINDOWS_CODE_SIGNING_CERTIFICATE_PATH}" \
              "${{ env.package_dir }}"
      - name: Generate Installer
        run: >
          nix develop --accept-flake-config --command
          makensis
          -DOUTFILE=../${{ env.install_artifact }}
          -DEXE_SOURCES=${{ env.package_dir }}
          -DVERSION=${{ env.version }}
          ${{ env.nsis_script }}
      - name: Sign Windows Installer
        run: |
          nix develop --accept-flake-config --command \
            bash scripts/sign_windows_artifacts.sh \
              "${WINDOWS_CODE_SIGNING_CERTIFICATE_PATH}" \
              "${{ env.install_artifact }}"
      - name: Remove Windows Signing Certificate
        if: ${{ always() }}
        run: |
          if [[ -n "${WINDOWS_CODE_SIGNING_CERTIFICATE_PATH:-}" ]]; then
            rm -f "${WINDOWS_CODE_SIGNING_CERTIFICATE_PATH}"
          fi
      - name: Upload Portable Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.package_artifact }}
          path: ${{ env.package_dir }}
      - name: Upload Installer Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.install_artifact }}
          path: ${{ env.install_artifact }}
