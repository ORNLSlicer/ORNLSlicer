  "seam_attractor_vector": {
    "name": "seam_attractor_vector",
    "display": "Seam Attractor Vector",
    "widget": "vector3",
    "tooltip": "Vector used to project seam attractor points onto each slicing plane. Leave all components at 0 to use the slicing vector automatically.",
    "depends": {
      "AND": [
        {
          "slicing_mode": 0
        },
        {
          "OR": [
            {
              "island_order_optimization": 6
            },
            {
              "OR": [
                {
                  "OR": [
                    {
                      "path_order_optimization": 5
                    },
                    {
                      "OR": [
                        {
                          "perimeter_path_order_optimization": 6
                        },
                        {
                          "OR": [
                            {
                              "inset_path_order_optimization": 6
                            },
                            {
                              "skin_path_order_optimization": 6
                            }
                          ]
                        }
                      ]
                    }
                  ]
                },
                {
                  "OR": [
                    {
                      "point_order_optimization": 4
                    },
                    {
                      "point_order_optimization": 5
                    }
                  ]
                }
              ]
            }
          ]
        }
      ]
    },
    "minor": "Optimizations",
    "major": "Profile",
    "local": true,
    "components": [
      {
        "setting": "seam_attractor_vector_x",
        "label": "X",
        "type": "unitless_float",
        "default": 0
      },
      {
        "setting": "seam_attractor_vector_y",
        "label": "Y",
        "type": "unitless_float",
        "default": 0
      },
      {
        "setting": "seam_attractor_vector_z",
        "label": "Z",
        "type": "unitless_float",
        "default": 0
      }
    ]
  }
