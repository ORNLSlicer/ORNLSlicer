# Canonical settings metadata for ORNLSlicer.
# Edit this file instead of resources/configs/master.conf.
settings:
  - name: "wire_feed_enable"
    display: "Enable Wire Feed Mode"
    type: "boolean"
    tooltip: "If selected, wire feed commands will be added to areas identified by settings regions"
    depends: {"wire_feed_enable":true}
    options: []
    default: false
    minor: "Wire Feed"
    major: "Experimental"
    namespace: "Experimental::WireFeed"
    symbol: "kEnableWireFeedMode"
    local: true
  - name: "setting_region_mesh_split"
    display: "Enable Setting Region Mesh Split"
    type: "boolean"
    tooltip: "If selected, settings regions will split mesh into separate islands before calculating pathing."
    depends: {}
    options: []
    default: false
    minor: "Wire Feed"
    major: "Experimental"
    namespace: "Experimental::WireFeed"
    symbol: "kEnableSettingRegionMeshSplit"
    local: false
  - name: "wire_feed_initial_travel"
    display: "Initial Travel Velocity"
    type: "speed"
    tooltip: "Velocity for first travel that moves to start of wire feed sequence"
    depends: {"wire_feed_enable":true}
    options: []
    default: 0
    minor: "Wire Feed"
    major: "Experimental"
    namespace: "Experimental::WireFeed"
    symbol: "kInitialTravelVelocity"
    local: true
  - name: "anchor_enable"
    display: "Enable Anchor"
    type: "boolean"
    tooltip: "If selected, anchors will be programmatically generated around designated wire feed locations"
    depends: {"wire_feed_enable":true}
    options: []
    default: false
    minor: "Wire Feed"
    major: "Experimental"
    namespace: "Experimental::WireFeed"
    symbol: "kEnableAnchor"
    local: true
  - name: "anchor_width"
    display: "Anchor Width"
    type: "distance"
    tooltip: "Width of anchor"
    depends: {"AND":[{"wire_feed_enable":true},{"anchor_enable":true}]}
    options: []
    default: 0
    minor: "Wire Feed"
    major: "Experimental"
    namespace: "Experimental::WireFeed"
    symbol: "kAnchorWidth"
    local: true
  - name: "anchor_height"
    display: "Anchor Height"
    type: "distance"
    tooltip: "Height of anchor"
    depends: {"AND":[{"wire_feed_enable":true},{"anchor_enable":true}]}
    options: []
    default: 0
    minor: "Wire Feed"
    major: "Experimental"
    namespace: "Experimental::WireFeed"
    symbol: "kAnchorHeight"
    local: true
  - name: "anchor_object_distance_left"
    display: "Anchor Separation Distance (Left Side)"
    type: "distance"
    tooltip: "Distance between bounding rectangles of object and first anchor on the left"
    depends: {"AND":[{"wire_feed_enable":true},{"anchor_enable":true}]}
    options: []
    default: 0
    minor: "Wire Feed"
    major: "Experimental"
    namespace: "Experimental::WireFeed"
    symbol: "kAnchorSeparationDistance(LeftSide)"
    local: true
  - name: "anchor_object_distance_right"
    display: "Anchor Separation Distance (Right Side)"
    type: "distance"
    tooltip: "Distance between bounding rectangles of object and second anchor on the right"
    depends: {"AND":[{"wire_feed_enable":true},{"anchor_enable":true}]}
    options: []
    default: 0
    minor: "Wire Feed"
    major: "Experimental"
    namespace: "Experimental::WireFeed"
    symbol: "kAnchorSeparationDistance(RightSide)"
    local: true
  - name: "wire_feed_cutoff_distance"
    display: "Wire Cutoff Distance"
    type: "distance"
    tooltip: "Distance from the end of the path when wire feed is disabled."
    depends: {"AND":[{"wire_feed_enable":true},{"syntax":10}]}
    options: []
    default: 0
    minor: "Wire Feed"
    major: "Experimental"
    namespace: "Experimental::WireFeed"
    symbol: "kWireCutoffDistance"
    local: true
  - name: "wire_feed_stickout_distance"
    display: "Wire Stickout Distance"
    type: "distance"
    tooltip: "Length of wire to extrude before turning the polymer extruder on."
    depends: {"AND":[{"wire_feed_enable":true},{"syntax":10}]}
    options: []
    default: 0
    minor: "Wire Feed"
    major: "Experimental"
    namespace: "Experimental::WireFeed"
    symbol: "kWireStickoutDistance"
    local: true
  - name: "wire_feed_prestart_distance"
    display: "Wire Prestart Distance"
    type: "distance"
    tooltip: "Length of wire to extrude to establish wire feed in bead at start."
    depends: {"AND":[{"wire_feed_enable":true},{"syntax":10}]}
    options: []
    default: 0
    minor: "Wire Feed"
    major: "Experimental"
    namespace: "Experimental::WireFeed"
    symbol: "kWirePrestartDistance"
    local: true
