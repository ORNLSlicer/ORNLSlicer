# Canonical settings metadata for ORNLSlicer.
# Edit this file instead of resources/configs/master.conf.
settings:
  - name: "trajectory_angle_slow_down"
    display: "Enable Trajectory Auto Speed Ramping"
    type: "boolean"
    tooltip: "Enables speed and extruder ramping around corners whose computed trajectory angle is below Angle Threshold."
    depends: {"slicing_mode":0}
    options: []
    default: false
    minor: "Auto Speed Ramping"
    major: "Experimental"
    namespace: "Experimental::AutoSpeedRamping"
    symbol: "kEnableTrajectoryAutoSpeedRamping"
    local: true
  - name: "trajectory_angle_threshold_slow_down"
    display: "Angle Threshold"
    type: "angle"
    tooltip: "Sets the trajectory-angle cutoff for auto speed ramping. A corner qualifies when its computed angle is less than this threshold."
    depends: {"AND":[{"slicing_mode":0},{"trajectory_angle_slow_down":true}]}
    options: []
    default: 2.3562
    minor: "Auto Speed Ramping"
    major: "Experimental"
    namespace: "Experimental::AutoSpeedRamping"
    symbol: "kAngleThreshold"
    local: true
  - name: "trajectory_angle_distance_slow_down"
    display: "Min Ramp Down Distance"
    type: "distance"
    tooltip: "Sets the minimum path distance before a qualifying corner over which the ramp-down values are applied."
    depends: {"AND":[{"slicing_mode":0},{"trajectory_angle_slow_down":true}]}
    options: []
    default: 25400
    minor: "Auto Speed Ramping"
    major: "Experimental"
    namespace: "Experimental::AutoSpeedRamping"
    symbol: "kMinRampDownDistance"
    local: true
  - name: "trajectory_angle_distance_speed_up"
    display: "Min Ramp Up Distance"
    type: "distance"
    tooltip: "Sets the minimum path distance after a qualifying corner over which the ramp-up values are applied."
    depends: {"AND":[{"slicing_mode":0},{"trajectory_angle_slow_down":true}]}
    options: []
    default: 25400
    minor: "Auto Speed Ramping"
    major: "Experimental"
    namespace: "Experimental::AutoSpeedRamping"
    symbol: "kMinRampUpDistance"
    local: true
  - name: "trajectory_angle_speed_slow_down"
    display: "Ramping Down Speed"
    type: "speed"
    tooltip: "Sets the reduced gantry speed used while ramping down before a corner whose trajectory angle is below the threshold."
    depends: {"AND":[{"slicing_mode":0},{"trajectory_angle_slow_down":true}]}
    options: []
    default: 25400
    minor: "Auto Speed Ramping"
    major: "Experimental"
    namespace: "Experimental::AutoSpeedRamping"
    symbol: "kRampingDownSpeed"
    local: true
  - name: "trajectory_angle_extruder_speed_slow_down"
    display: "Ramping Down Extruder Speed"
    type: "rpm"
    tooltip: "Sets the extruder speed used while ramping down before a corner whose trajectory angle is below the threshold."
    depends: {"AND":[{"slicing_mode":0},{"trajectory_angle_slow_down":true}]}
    options: []
    default: 14
    minor: "Auto Speed Ramping"
    major: "Experimental"
    namespace: "Experimental::AutoSpeedRamping"
    symbol: "kRampingDownExtruderSpeed"
    local: true
  - name: "trajectory_angle_speed_up"
    display: "Ramping Up Speed"
    type: "speed"
    tooltip: "Sets the gantry speed used while ramping up after a corner whose trajectory angle is below the threshold."
    depends: {"AND":[{"slicing_mode":0},{"trajectory_angle_slow_down":true}]}
    options: []
    default: 50800
    minor: "Auto Speed Ramping"
    major: "Experimental"
    namespace: "Experimental::AutoSpeedRamping"
    symbol: "kRampingUpSpeed"
    local: true
  - name: "trajectory_angle_extruder_speed_up"
    display: "Ramping Up Extruder Speed"
    type: "rpm"
    tooltip: "Sets the extruder speed used while ramping up after a corner whose trajectory angle is below the threshold."
    depends: {"AND":[{"slicing_mode":0},{"trajectory_angle_slow_down":true}]}
    options: []
    default: 28
    minor: "Auto Speed Ramping"
    major: "Experimental"
    namespace: "Experimental::AutoSpeedRamping"
    symbol: "kRampingUpExtruderSpeed"
    local: true
