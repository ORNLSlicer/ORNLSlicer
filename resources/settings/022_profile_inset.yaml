# Canonical settings metadata for ORNLSlicer.
# Edit this file instead of resources/configs/master.conf.
settings:
  - name: "inset"
    display: "Enable Inset"
    type: "boolean"
    tooltip: "If selected, insets will be generated"
    depends: {}
    options: []
    default: false
    minor: "Inset"
    major: "Profile"
    namespace: "Profile::Inset"
    symbol: "kEnableInset"
    local: true
  - name: "inset_count"
    display: "Number of Insets"
    type: "positive_int"
    tooltip: "Number of insets"
    depends: {"inset":true}
    options: []
    default: 0
    minor: "Inset"
    major: "Profile"
    namespace: "Profile::Inset"
    symbol: "kNumberofInsets"
    local: true
  - name: "inset_width"
    display: "Inset Bead Width"
    type: "distance"
    tooltip: "Bead width for inset paths"
    depends: {"inset":true}
    options: []
    default: 0
    minor: "Inset"
    major: "Profile"
    namespace: "Profile::Inset"
    symbol: "kInsetBeadWidth"
    local: true
  - name: "inset_adapt"
    display: "Enable Adaptive Inset Bead Widths"
    type: "boolean"
    tooltip: "If selected, inset bead widths are adjusted within the configured limits to better fill narrow regions whose remaining contour space is not an exact multiple of the nominal bead width."
    depends: {"inset":true}
    options: []
    default: false
    minor: "Inset"
    major: "Profile"
    namespace: "Profile::Inset"
    symbol: "kEnableAdaptiveBeadWidths"
    local: true
  - name: "inset_adapt_min_width"
    display: "Minimum Adaptive Inset Bead Width"
    type: "distance"
    tooltip: "Minimum bead width allowed when adaptive inset bead widths are enabled."
    depends: {"AND":[{"inset":true},{"inset_adapt":true}]}
    options: []
    default: 0
    minor: "Inset"
    major: "Profile"
    namespace: "Profile::Inset"
    symbol: "kMinimumAdaptiveBeadWidth"
    local: true
  - name: "inset_adapt_max_width"
    display: "Maximum Adaptive Inset Bead Width"
    type: "distance"
    tooltip: "Maximum bead width allowed when adaptive inset bead widths are enabled."
    depends: {"AND":[{"inset":true},{"inset_adapt":true}]}
    options: []
    default: 10000
    minor: "Inset"
    major: "Profile"
    namespace: "Profile::Inset"
    symbol: "kMaximumAdaptiveBeadWidth"
    local: true
  - name: "inset_speed"
    display: "Inset Speed"
    type: "speed"
    tooltip: "Speed for inset paths"
    depends: {"inset":true}
    options: []
    default: 0
    minor: "Inset"
    major: "Profile"
    namespace: "Profile::Inset"
    symbol: "kInsetSpeed"
    local: true
  - name: "inset_extruder_speed"
    display: "Inset Extruder Speed"
    type: "rpm"
    tooltip: "Extruder speed for inset paths"
    depends: {"AND":[{"inset":true},{"AND":[{"enable_width_height":false},{"OR":[{"machine_type":0},{"OR":[{"machine_type":4},{"machine_type":5}]}]}]}]}
    options: []
    default: 0
    minor: "Inset"
    major: "Profile"
    namespace: "Profile::Inset"
    symbol: "kInsetExtruderSpeed"
    local: true
  - name: "inset_extrusion_multiplier"
    display: "Inset Extrusion Multiplier"
    type: "unitless_float"
    tooltip: "Extrusion multiplier to increase/decrease flowrate for inset paths for systems without RPM control"
    depends: {"AND":[{"inset":true},{"OR":[{"machine_type":1},{"syntax":26}]}]}
    options: []
    default: 1
    minor: "Inset"
    major: "Profile"
    namespace: "Profile::Inset"
    symbol: "kInsetExtrusionMultiplier"
    local: true
  - name: "inset_minimum_path_length"
    display: "Minimum Inset Path Length"
    type: "distance"
    tooltip: "Inset extrusion paths less than this value are deleted"
    depends: {"inset":true}
    options: []
    default: 0
    minor: "Inset"
    major: "Profile"
    namespace: "Profile::Inset"
    symbol: "kMinimumInsetPathLength"
    local: true
  - name: "inset_minimum_segment_length"
    display: "Minimum Inset Segment Length"
    type: "distance"
    tooltip: "Inset path segments shorter than this value are collapsed before extrusion paths are created"
    depends: {"inset":true}
    options: []
    default: 0
    minor: "Inset"
    major: "Profile"
    namespace: "Profile::Inset"
    symbol: "kMinimumInsetSegmentLength"
    local: true
  - name: "inset_overlap_distance"
    display: "Inset Overlap Distance"
    type: "distance"
    tooltip: "Width of the inset overlaps with exterior"
    depends: {"inset":true}
    options: []
    default: 0
    minor: "Inset"
    major: "Profile"
    namespace: "Profile::Inset"
    symbol: "kInsetOverlapDistance"
    local: true
  - name: "spiral_inset"
    display: "Enable Spiral Inset"
    type: "boolean"
    tooltip: "If selected, spiral insets will be generated"
    depends: {"inset":true}
    options: []
    default: false
    minor: "Inset"
    major: "Profile"
    namespace: "Profile::Inset"
    symbol: "kEnableSpiralInset"
    local: true
