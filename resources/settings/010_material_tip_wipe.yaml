# Canonical settings metadata for ORNLSlicer.
# Edit this file instead of resources/configs/master.conf.
settings:
  - name: "perimeter_wipe"
    display: "Enable Perimeter Tip Wipe"
    type: "boolean"
    tooltip: "If selected, will do a tip wipe for perimeter moves to prevent material from sticking up"
    depends: {"AND":[{"slicing_mode":0},{"perimeter":true}]}
    options: []
    default: false
    minor: "Tip Wipe"
    major: "Material"
    namespace: "Material::TipWipe"
    symbol: "kEnablePerimeterTipWipe"
    local: true
  - name: "perimeter_wipe_direction"
    display: "Perimeter Wipe Direction"
    type: "enumeration"
    tooltip: "Direction for all perimeter tip wipes. Optimal does forward for closed loops paths\\nand reverse for open loop paths"
    depends: {"AND":[{"slicing_mode":0},{"AND":[{"perimeter":true},{"perimeter_wipe":true}]}]}
    options:
      - "WIPE_OPTIMAL"
      - "WIPE_FORWARD"
      - "WIPE_REVERSE"
      - "WIPE_ANGLED"
    default: 0
    minor: "Tip Wipe"
    major: "Material"
    namespace: "Material::TipWipe"
    symbol: "kPerimeterWipeDirection"
    local: true
  - name: "perimeter_wipe_distance"
    display: "Perimeter Wipe Distance"
    type: "distance"
    tooltip: "Sets the travel distance for perimeter tip wiping. If using an incrementing wipe, this is the initial distance."
    depends: {"AND":[{"slicing_mode":0},{"AND":[{"perimeter":true},{"perimeter_wipe":true}]}]}
    options: []
    default: 0
    minor: "Tip Wipe"
    major: "Material"
    namespace: "Material::TipWipe"
    symbol: "kPerimeterWipeDistance"
    local: true
  - name: "perimeter_wipe_speed"
    display: "Perimeter Wipe Speed"
    type: "speed"
    tooltip: "Sets the speed for the perimeter tip wipe move"
    depends: {"AND":[{"slicing_mode":0},{"AND":[{"perimeter":true},{"perimeter_wipe":true}]}]}
    options: []
    default: 0
    minor: "Tip Wipe"
    major: "Material"
    namespace: "Material::TipWipe"
    symbol: "kPerimeterWipeSpeed"
    local: true
  - name: "perimeter_wipe_extruder_speed"
    display: "Perimeter Wipe Extruder Speed"
    type: "deposition_rate"
    tooltip: "Deposition control value for the perimeter tip wipe move. Meld Friction Stir uses velocity; M24 S outputs in/min * 1000. Other machine types use RPM."
    depends: {"AND":[{"slicing_mode":0},{"AND":[{"perimeter":true},{"perimeter_wipe":true}]}]}
    options: []
    default: 0
    minor: "Tip Wipe"
    major: "Material"
    namespace: "Material::TipWipe"
    symbol: "kPerimeterWipeExtruderSpeed"
    local: true
  - name: "perimeter_wipe_angle"
    display: "Perimeter Wipe Angle"
    type: "angle"
    tooltip: "Sets the angle of the perimeter tip wipe"
    depends: {"AND":[{"slicing_mode":0},{"AND":[{"perimeter":true},{"AND":[{"perimeter_wipe":true},{"perimeter_wipe_direction":3}]}]}]}
    options: []
    default: 0
    minor: "Tip Wipe"
    major: "Material"
    namespace: "Material::TipWipe"
    symbol: "kPerimeterWipeAngle"
    local: true
  - name: "perimeter_wipe_cutoff_distance"
    display: "Perimeter Wipe Cutoff Distance"
    type: "distance"
    tooltip: "Sets the distance from the end of the perimeter tip wipe to turn the extruder off"
    depends: {"AND":[{"slicing_mode":0},{"AND":[{"perimeter":true},{"perimeter_wipe":true}]}]}
    options: []
    default: 0
    minor: "Tip Wipe"
    major: "Material"
    namespace: "Material::TipWipe"
    symbol: "kPerimeterWipeCutoffDistance"
    local: true
  - name: "perimeter_wipe_lift_height"
    display: "Perimeter Wipe Lift Height"
    type: "distance"
    tooltip: "Sets the distance to lift during the perimeter tip wipe move"
    depends: {"AND":[{"slicing_mode":0},{"AND":[{"perimeter":true},{"perimeter_wipe":true}]}]}
