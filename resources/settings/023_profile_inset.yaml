# Canonical settings metadata for ORNLSlicer.
# Edit this file instead of resources/configs/master.conf.
settings:
  - name: "inset"
    display: "Enable Inset"
    type: "boolean"
    tooltip: "If selected, insets will be generated"
    depends: {"slicing_mode":0}
    options: []
    default: false
    minor: "Inset"
    major: "Profile"
    namespace: "Profile::Inset"
    symbol: "kEnableInset"
    local: true
  - name: "inset_count"
    display: "Number of Insets"
    type: "positive_int"
    tooltip: "Sets the number of inward contour paths generated after the perimeter. The editor accepts 1 or more; the built-in catalog fallback is 0, so set an explicit value before enabling insets."
    depends: {"AND":[{"slicing_mode":0},{"inset":true}]}
    options: []
    default: 0
    minor: "Inset"
    major: "Profile"
    namespace: "Profile::Inset"
    symbol: "kNumberofInsets"
    local: true
  - name: "inset_width"
    display: "Inset Bead Width"
    type: "distance"
    tooltip: "Bead width for inset paths"
    depends: {"AND":[{"slicing_mode":0},{"inset":true}]}
    options: []
    default: 0
    minor: "Inset"
    major: "Profile"
    namespace: "Profile::Inset"
    symbol: "kInsetBeadWidth"
    local: true
  - name: "inset_adapt"
    display: "Enable Adaptive Inset Bead Widths"
    type: "boolean"
    tooltip: "If selected, inset bead widths are adjusted within the configured limits to better fill narrow regions whose remaining contour space is not an exact multiple of the nominal bead width."
    depends: {"AND":[{"slicing_mode":0},{"inset":true}]}
    options: []
    default: false
    minor: "Inset"
    major: "Profile"
    namespace: "Profile::Inset"
    symbol: "kEnableAdaptiveBeadWidths"
    local: false
  - name: "inset_adapt_min_width"
    display: "Minimum Adaptive Inset Bead Width"
    type: "distance"
    tooltip: "Minimum bead width allowed when adaptive inset bead widths are enabled."
    depends: {"AND":[{"slicing_mode":0},{"AND":[{"inset":true},{"inset_adapt":true}]}]}
    options: []
    default: 0
    minor: "Inset"
    major: "Profile"
    namespace: "Profile::Inset"
    symbol: "kMinimumAdaptiveBeadWidth"
    local: false
  - name: "inset_adapt_max_width"
    display: "Maximum Adaptive Inset Bead Width"
    type: "distance"
    tooltip: "Maximum bead width allowed when adaptive inset bead widths are enabled."
    depends: {"AND":[{"slicing_mode":0},{"AND":[{"inset":true},{"inset_adapt":true}]}]}
    options: []
    default: 10000
    minor: "Inset"
    major: "Profile"
    namespace: "Profile::Inset"
    symbol: "kMaximumAdaptiveBeadWidth"
    local: false
  - name: "inset_speed"
    display: "Inset Speed"
    type: "speed"
    tooltip: "Speed for inset paths"
    depends: {"AND":[{"slicing_mode":0},{"inset":true}]}
    options: []
    default: 0
    minor: "Inset"
    major: "Profile"
    namespace: "Profile::Inset"
    symbol: "kInsetSpeed"
    local: true
  - name: "inset_extruder_speed"
    display: "Inset Extruder Speed"
    type: "rpm"
    tooltip: "Extruder speed for inset paths"
    depends: {"AND":[{"slicing_mode":0},{"AND":[{"inset":true},{"AND":[{"enable_width_height":false},{"OR":[{"machine_type":0},{"OR":[{"machine_type":4},{"machine_type":5}]}]}]}]}]}
    options: []
    default: 0
    minor: "Inset"
    major: "Profile"
    namespace: "Profile::Inset"
    symbol: "kInsetExtruderSpeed"
    local: true
  - name: "inset_extrusion_multiplier"
    display: "Inset Extrusion Multiplier"
    type: "unitless_float"
    tooltip: "Extrusion multiplier to increase/decrease flowrate for inset paths for systems without RPM control"
    depends: {"AND":[{"slicing_mode":0},{"AND":[{"inset":true},{"OR":[{"machine_type":1},{"OR":[{"syntax":26},{"AND":[{"syntax":11},{"AND":[{"machine_type":0},{"enable_width_height":true}]}]}]}]}]}]}
    options: []
    default: 1
    minor: "Inset"
    major: "Profile"
    namespace: "Profile::Inset"
    symbol: "kInsetExtrusionMultiplier"
    local: true
  - name: "inset_minimum_path_length"
    display: "Minimum Inset Path Length"
    type: "distance"
    tooltip: "Inset extrusion paths less than this value are deleted"
    depends: {"AND":[{"slicing_mode":0},{"inset":true}]}
    options: []
    default: 0
    minor: "Inset"
    major: "Profile"
    namespace: "Profile::Inset"
    symbol: "kMinimumInsetPathLength"
    local: true
  - name: "inset_minimum_segment_length"
    display: "Minimum Inset Segment Length"
    type: "distance"
    tooltip: "Inset path segments shorter than this value are collapsed before extrusion paths are created"
    depends: {"AND":[{"slicing_mode":0},{"inset":true}]}
    options: []
    default: 0
    minor: "Inset"
    major: "Profile"
    namespace: "Profile::Inset"
    symbol: "kMinimumInsetSegmentLength"
    local: true
  - name: "inset_overlap_distance"
    display: "Inset Overlap Distance"
    type: "distance"
    tooltip: "Width of the inset overlaps with exterior"
    depends: {"AND":[{"slicing_mode":0},{"inset":true}]}
    options: []
    default: 0
    minor: "Inset"
    major: "Profile"
    namespace: "Profile::Inset"
    symbol: "kInsetOverlapDistance"
    local: true
  - name: "connect_insets"
    display: "Connect Insets"
    type: "boolean"
    tooltip: "If selected, adjacent inset loops will be joined with extrusion connections."
    depends: {"AND":[{"slicing_mode":0},{"inset":true}]}
    options: []
    default: false
    minor: "Inset"
    major: "Profile"
    namespace: "Profile::Inset"
    symbol: "kConnectInsets"
    local: true
  - name: "inset_complete_loop_before_connecting"
    display: "Complete loop before connecting"
    type: "boolean"
    tooltip: "If selected, connected insets will complete the current loop before connecting to the next loop."
    depends: {"AND":[{"slicing_mode":0},{"AND":[{"inset":true},{"connect_insets":true}]}]}
    options: []
    default: false
    minor: "Inset"
    major: "Profile"
    namespace: "Profile::Inset"
    symbol: "kCompleteLoopBeforeConnecting"
    local: false
  - name: "inset_connect_after_tip_wipe"
    display: "Connect after forward tip wipe"
    type: "boolean"
    tooltip: "If selected, standalone connected insets will apply their forward tip wipe before connecting to the next loop. This also controls fallback inset output when a requested perimeter-to-inset connection is unavailable."
    depends: {"AND":[{"slicing_mode":0},{"AND":[{"inset":true},{"AND":[{"connect_insets":true},{"AND":[{"inset_wipe":true},{"inset_wipe_direction":1}]}]}]}]}
    options: []
    default: false
    minor: "Inset"
    major: "Profile"
    namespace: "Profile::Inset"
    symbol: "kConnectAfterTipWipe"
    local: false
