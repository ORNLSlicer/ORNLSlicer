# Canonical settings metadata for ORNLSlicer.
# Edit this file instead of resources/configs/master.conf.
settings:
  - name: "slicer_type"
    display: "Slicer Type"
    type: "enumeration"
    tooltip: "What type of slicer to use"
    depends: {}
    options:
      - "Polymer"
      - "Metal Embossing"
      - "Metal"
      - "Real Time Polymer"
      - "Image"
    default: 0
    minor: "Printer Configuration"
    major: "Experimental"
    namespace: "Experimental::PrinterConfiguration"
    symbol: "kSlicerType"
    local: false
  - name: "layer_ordering"
    display: "Layer Ordering"
    type: "enumeration"
    tooltip: "How to order layers across multiple parts"
    depends: {}
    options:
      - "By Height"
      - "By Layer Number"
      - "By Part (Sequential)"
    default: 0
    minor: "Printer Configuration"
    major: "Experimental"
    namespace: "Experimental::PrinterConfiguration"
    symbol: "kLayerOrdering"
    local: false
  - name: "layer_grouping_tolerance"
    display: "Layer Grouping Tolerance"
    type: "distance"
    tooltip: "Layers with the same plane normal that are separated by a distance less than this value will be assigned to the same global layer."
    depends: {"layer_ordering":0}
    options: []
    default: 1
    minor: "Printer Configuration"
    major: "Experimental"
    namespace: "Experimental::PrinterConfiguration"
    symbol: "kLayerGroupingTolerance"
    local: false
