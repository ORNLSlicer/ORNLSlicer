# Canonical settings metadata for ORNLSlicer.
# Edit this file instead of resources/configs/master.conf.
settings:
  - name: "printing_material"
    display: "Printing Material"
    type: "enumeration"
    tooltip: "Selects the built-in material density used to convert estimated deposited volume to mass. Choose Other to enter a custom density."
    depends: {}
    options:
      - "ABS20CF"
      - "ABS"
      - "PPS"
      - "PPS50CF"
      - "PPSU"
      - "PPSU25CF"
      - "PESU"
      - "PESU25CF"
      - "PLA"
      - "Concrete"
      - "Other"
    default: 0
    minor: "Density"
    major: "Material"
    namespace: "Material::Density"
    symbol: "kPrintingMaterial"
    local: false
  - name: "other_density"
    display: "Other Density"
    type: "density"
    tooltip: "Sets the custom material density used for deposited-mass estimation when Printing Material is Other."
    depends: {"printing_material":10}
    options: []
    default: 0
    minor: "Density"
    major: "Material"
    namespace: "Material::Density"
    symbol: "kOtherDensity"
    local: false
