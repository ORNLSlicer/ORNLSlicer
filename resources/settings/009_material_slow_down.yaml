# Canonical settings metadata for ORNLSlicer.
# Edit this file instead of resources/configs/master.conf.
settings:
  - name: "perimeter_slow_down"
    display: "Enable Perimeter Slow Down"
    type: "boolean"
    tooltip: "If selected, will move at a slower speed for a certain distance at the end of a perimeter path"
    depends: {"perimeter":true}
    options: []
    default: false
    minor: "Slow Down"
    major: "Material"
    namespace: "Material::SlowDown"
    symbol: "kEnablePerimeterSlowDown"
    local: true
  - name: "perimeter_slow_down_distance"
    display: "Perimeter Slow Down Distance"
    type: "distance"
    tooltip: "Distance for the perimeter slow down move"
    depends: {"AND":[{"perimeter":true},{"perimeter_slow_down":true}]}
    options: []
    default: 0
    minor: "Slow Down"
    major: "Material"
    namespace: "Material::SlowDown"
    symbol: "kPerimeterSlowDownDistance"
    local: true
  - name: "perimeter_slow_down_lift_distance"
    display: "Perimeter Slow Down Lift Distance"
    type: "distance"
    tooltip: "Distance to lift during the perimeter slow down move"
    depends: {"AND":[{"perimeter":true},{"perimeter_slow_down":true}]}
    options: []
    default: 0
    minor: "Slow Down"
    major: "Material"
    namespace: "Material::SlowDown"
    symbol: "kPerimeterSlowDownLiftDistance"
    local: true
  - name: "perimeter_slow_down_speed"
    display: "Perimeter Slow Down Speed"
    type: "speed"
    tooltip: "Speed for the perimeter slow down move"
