# Canonical settings metadata for ORNLSlicer.
# Edit this file instead of resources/configs/master.conf.
settings:
  - name: "slicing_mode"
    display: "Slicing Mode"
    type: "enumeration"
    tooltip: "Selects the slicing workflow to use. Planar creates flat layer slices along the slice plane normal. Cylindrical creates radial or helical paths around a cylinder axis. Image creates image slices from the model cross sections."
    depends: {}
    options:
      - "Planar"
      - "Cylindrical"
      - "Image"
    default: 0
    minor: "Slicing"
    major: "Profile"
    namespace: "Profile::Slicing"
    symbol: "kSlicingMode"
    local: false
  - name: "slice_plane_normal_x"
    display: "Slice Plane Normal - X"
    type: "unitless_float"
    tooltip: "X component of the slice plane normal. Values are normalized before slicing; {1, 0, 1} creates a 45-degree tilt about the Y-axis, while {1, 0, 0} creates YZ slice planes."
    depends: {"slicing_mode":0}
    options: []
    default: 0
    minor: "Slicing"
    major: "Profile"
    namespace: "Profile::Slicing"
    symbol: "kSlicePlaneNormalX"
    local: false
  - name: "slice_plane_normal_y"
    display: "Slice Plane Normal - Y"
    type: "unitless_float"
    tooltip: "Y component of the slice plane normal. Values are normalized before slicing; {0, 1, 1} creates a 45-degree tilt about the X-axis, while {0, 1, 0} creates XZ slice planes."
    depends: {"slicing_mode":0}
    options: []
    default: 0
    minor: "Slicing"
    major: "Profile"
    namespace: "Profile::Slicing"
    symbol: "kSlicePlaneNormalY"
    local: false
  - name: "slice_plane_normal_z"
    display: "Slice Plane Normal - Z"
    type: "unitless_float"
    tooltip: "Z component of the slice plane normal. Values are normalized before slicing; {0, 0, 1} creates horizontal XY layers."
    depends: {"slicing_mode":0}
    options: []
    default: 1
    minor: "Slicing"
    major: "Profile"
    namespace: "Profile::Slicing"
    symbol: "kSlicePlaneNormalZ"
    local: false
  - name: "cylinder_axis_source"
    display: "Cylinder Axis Source"
    type: "enumeration"
    tooltip: "Selects the XY centerline used for cylindrical slicing. Part Centroid uses each part's XY centroid. Custom XY uses the configured cylinder axis coordinates."
    depends: {"slicing_mode":1}
    options:
      - "Part Centroid"
      - "Custom XY"
    default: 0
    minor: "Slicing"
    major: "Profile"
    namespace: "Profile::Slicing"
    symbol: "kCylinderAxisSource"
    local: true
  - name: "cylinder_axis_x"
    display: "Cylinder Axis - X"
    type: "location"
    tooltip: "X coordinate of the custom cylinder axis."
    depends: {"AND":[{"slicing_mode":1},{"cylinder_axis_source":1}]}
    options: []
    default: 0
    minor: "Slicing"
    major: "Profile"
    namespace: "Profile::Slicing"
    symbol: "kCylinderAxisX"
    local: true
  - name: "cylinder_axis_y"
    display: "Cylinder Axis - Y"
    type: "location"
    tooltip: "Y coordinate of the custom cylinder axis."
    depends: {"AND":[{"slicing_mode":1},{"cylinder_axis_source":1}]}
    options: []
    default: 0
    minor: "Slicing"
    major: "Profile"
    namespace: "Profile::Slicing"
    symbol: "kCylinderAxisY"
    local: true
  - name: "cylinder_inner_radius"
    display: "Cylinder Inner Radius"
    type: "distance"
    tooltip: "Sets the starting inner radius for cylindrical paths. The first path is generated one half layer height beyond this radius."
    depends: {"slicing_mode":1}
    options: []
    default: 0
    minor: "Slicing"
    major: "Profile"
    namespace: "Profile::Slicing"
    symbol: "kCylinderInnerRadius"
    local: true
  - name: "cylinder_height"
    display: "Cylinder Height"
    type: "distance"
    tooltip: "Limits cylindrical path generation to this height above the part base. Values less than or equal to zero use the part height."
    depends: {"slicing_mode":1}
    options: []
    default: 0
    minor: "Slicing"
    major: "Profile"
    namespace: "Profile::Slicing"
    symbol: "kCylinderHeight"
    local: true
  - name: "cylindrical_path_pattern"
    display: "Cylindrical Path Pattern"
    type: "enumeration"
    tooltip: "Selects the path pattern generated by cylindrical slicing. Radial creates concentric paths at each Z section. Helical creates rising spiral paths around the cylinder axis."
    depends: {"slicing_mode":1}
    options:
      - "Radial"
      - "Helical"
    default: 0
    minor: "Slicing"
    major: "Profile"
    namespace: "Profile::Slicing"
    symbol: "kCylindricalPathPattern"
    local: false
  - name: "radial_path_boundary_policy"
    display: "Radial Path Boundary Policy"
    type: "enumeration"
    tooltip: "Controls radial paths that intersect the model boundary. Clip keeps only the portions inside the model. Keep outputs the original path if any portion is inside. Discard omits paths that are cut by the boundary."
    depends: {"AND":[{"slicing_mode":1},{"cylindrical_path_pattern":0}]}
    options:
      - "Clip"
      - "Keep"
      - "Discard"
    default: 0
    minor: "Slicing"
    major: "Profile"
    namespace: "Profile::Slicing"
    symbol: "kRadialPathBoundaryPolicy"
    local: true
  - name: "radial_path_start_angle"
    display: "Radial Path Start Angle"
    type: "angle"
    tooltip: "Sets the angular start position for generated radial paths around the cylinder axis. 0 degrees starts on +X and 90 degrees starts on +Y."
    depends: {"AND":[{"slicing_mode":1},{"cylindrical_path_pattern":0}]}
    options: []
    default: 0
    minor: "Slicing"
    major: "Profile"
    namespace: "Profile::Slicing"
    symbol: "kRadialPathStartAngle"
    local: true
  - name: "helical_path_boundary_policy"
    display: "Helical Path Boundary Policy"
    type: "enumeration"
    tooltip: "Controls helical paths that intersect the model boundary. Clip keeps every retained section inside the model. Clip Z keeps the continuous helix through the highest Z intersection."
    depends: {"AND":[{"slicing_mode":1},{"cylindrical_path_pattern":1}]}
    options:
      - "Clip"
      - "Clip Z"
    default: 0
    minor: "Slicing"
    major: "Profile"
    namespace: "Profile::Slicing"
    symbol: "kHelicalPathBoundaryPolicy"
    local: true
  - name: "helical_path_handedness"
    display: "Helical Path Handedness"
    type: "enumeration"
    tooltip: "Selects the handedness for generated helical paths. Right Handed uses a counter-clockwise XY sweep as Z rises. Left Handed mirrors the sweep clockwise while preserving positive Z rise."
    depends: {"AND":[{"slicing_mode":1},{"cylindrical_path_pattern":1}]}
    options:
      - "Right Handed"
      - "Left Handed"
    default: 0
    minor: "Slicing"
    major: "Profile"
    namespace: "Profile::Slicing"
    symbol: "kHelicalPathHandedness"
    local: true
  - name: "helical_path_start_angle"
    display: "Helical Path Start Angle"
    type: "angle"
    tooltip: "Sets the angular start position for generated helical paths around the cylinder axis. 0 degrees starts on +X and 90 degrees starts on +Y."
    depends: {"AND":[{"slicing_mode":1},{"cylindrical_path_pattern":1}]}
    options: []
    default: 90
    minor: "Slicing"
    major: "Profile"
    namespace: "Profile::Slicing"
    symbol: "kHelicalPathStartAngle"
    local: true
  - name: "max_helical_path_length"
    display: "Max Helical Path Length"
    type: "distance"
    tooltip: "Maximum length of each generated helical path segment. Set to 0 to leave helical paths unsplit."
    depends: {"AND":[{"slicing_mode":1},{"cylindrical_path_pattern":1}]}
    options: []
    default: 0
    minor: "Slicing"
    major: "Profile"
    namespace: "Profile::Slicing"
    symbol: "kMaxHelicalPathLength"
    local: false
  - name: "arcs_per_revolution"
    display: "Arcs per Revolution"
    type: "positive_int"
    tooltip: "Sets the maximum number of circular arc spans used for each full revolution of cylindrical motion. Minimum is 1."
    depends: {"slicing_mode":1}
    options: []
    default: 1
    minor: "Slicing"
    major: "Profile"
    namespace: "Profile::Slicing"
    symbol: "kArcsPerRevolution"
    local: false
  - name: "image_pixel_size_x"
    display: "Image Pixel Size - X"
    type: "distance"
    tooltip: "Physical X size of each generated image pixel."
    depends: {"slicing_mode":2}
    options: []
    default: 0
    minor: "Slicing"
    major: "Profile"
    namespace: "Profile::Slicing"
    symbol: "kImagePixelSizeX"
    local: false
  - name: "image_pixel_size_y"
    display: "Image Pixel Size - Y"
    type: "distance"
    tooltip: "Physical Y size of each generated image pixel."
    depends: {"slicing_mode":2}
    options: []
    default: 0
    minor: "Slicing"
    major: "Profile"
    namespace: "Profile::Slicing"
    symbol: "kImagePixelSizeY"
    local: false
inputs:
  - name: "image_pixel_size"
    display: "Image Pixel Size"
    widget: "vector2"
    tooltip: "Defines the physical X and Y size of pixels in generated image slices."
    depends: {"slicing_mode":2}
    minor: "Slicing"
    major: "Profile"
    components:
      - setting: "image_pixel_size_x"
        label: "X"
      - setting: "image_pixel_size_y"
        label: "Y"
  - name: "cylinder_axis"
    display: "Cylinder Axis"
    widget: "vector2"
    tooltip: "Defines the custom XY coordinate used as the cylinder axis."
    depends: {"AND":[{"slicing_mode":1},{"cylinder_axis_source":1}]}
    minor: "Slicing"
    major: "Profile"
    components:
      - setting: "cylinder_axis_x"
        label: "X"
      - setting: "cylinder_axis_y"
        label: "Y"
  - name: "slice_plane_normal"
    display: "Slice Plane Normal"
    widget: "vector3"
    tooltip: "Defines the normal direction for planar slice planes. Values are normalized before slicing; {0, 0, 1} creates horizontal XY layers."
    depends: {"slicing_mode":0}
    minor: "Slicing"
    major: "Profile"
    components:
      - setting: "slice_plane_normal_x"
        label: "X"
      - setting: "slice_plane_normal_y"
        label: "Y"
      - setting: "slice_plane_normal_z"
        label: "Z"
