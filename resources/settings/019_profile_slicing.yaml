# Canonical settings metadata for ORNLSlicer.
# Edit this file instead of resources/configs/master.conf.
settings:
  - name: "slicer_type"
    display: "Slicer Type"
    type: "enumeration"
    tooltip: "Selects the slicing engine to use"
    depends: {}
    options:
      - "Planar"
      - "Image"
      - "Radial Slice"
      - "Helical Slice"
    default: 0
    minor: "Slicing"
    major: "Profile"
    namespace: "Profile::Slicing"
    symbol: "kSlicerType"
    local: false
  - name: "radial_axis_mode"
    display: "Radial Axis Mode"
    type: "enumeration"
    tooltip: "Selects the XY axis used for radial cylinder or helical slicing. Part Centroid uses each build part's centroid, while Custom XY uses the configured radial axis coordinates."
    depends: {"OR":[{"slicer_type":2},{"slicer_type":3}]}
    options:
      - "Part Centroid"
      - "Custom XY"
    default: 0
    minor: "Slicing"
    major: "Profile"
    namespace: "Profile::Slicing"
    symbol: "kRadialAxisMode"
    local: true
  - name: "radial_axis_x"
    display: "Radial Axis X"
    type: "location"
    tooltip: "X coordinate for the radial cylinder or helical axis when Radial Axis Mode is Custom XY."
    depends: {"AND":[{"OR":[{"slicer_type":2},{"slicer_type":3}]},{"radial_axis_mode":1}]}
    options: []
    default: 0
    minor: "Slicing"
    major: "Profile"
    namespace: "Profile::Slicing"
    symbol: "kRadialAxisX"
    local: true
  - name: "radial_axis_y"
    display: "Radial Axis Y"
    type: "location"
    tooltip: "Y coordinate for the radial cylinder or helical axis when Radial Axis Mode is Custom XY."
    depends: {"AND":[{"OR":[{"slicer_type":2},{"slicer_type":3}]},{"radial_axis_mode":1}]}
    options: []
    default: 0
    minor: "Slicing"
    major: "Profile"
    namespace: "Profile::Slicing"
    symbol: "kRadialAxisY"
    local: true
  - name: "radial_initial_radius"
    display: "Radial Initial Radius"
    type: "distance"
    tooltip: "Starting radius for radial cylinder or helical slicing. Values less than or equal to zero use half the layer height."
    depends: {"OR":[{"slicer_type":2},{"slicer_type":3}]}
    options: []
    default: 0
    minor: "Slicing"
    major: "Profile"
    namespace: "Profile::Slicing"
    symbol: "kRadialInitialRadius"
    local: true
  - name: "radial_boundary_handling"
    display: "Radial Boundary Handling"
    type: "enumeration"
    tooltip: "Controls radial or helical paths that cross the model boundary. Clip to model uses slicer-specific model clipping and the selected Helical Clipping Method when applicable, keep boundary-crossing path outputs the original path when any portion is inside, and discard boundary-crossing path omits paths cut by the model boundary."
    depends: {"OR":[{"slicer_type":2},{"slicer_type":3}]}
    options:
      - "Clip to Model"
      - "Keep Boundary-Crossing Path"
      - "Discard Boundary-Crossing Path"
    default: 0
    minor: "Slicing"
    major: "Profile"
    namespace: "Profile::Slicing"
    symbol: "kRadialBoundaryHandling"
    local: true
  - name: "helical_clipping_method"
    display: "Helical Clipping Method"
    type: "enumeration"
    tooltip: "Selects whether Clip to Model keeps every portion inside the model or one continuous helix through the model intersection with the greatest Z value."
    depends: {"AND":[{"slicer_type":3},{"radial_boundary_handling":0}]}
    options:
      - "All Model Intersections"
      - "Highest Z Intersection"
    default: 0
    minor: "Slicing"
    major: "Profile"
    namespace: "Profile::Slicing"
    symbol: "kHelicalClippingMethod"
    local: true
  - name: "slicing_vector_x"
    display: "Slicing Vector - X"
    type: "unitless_float"
    tooltip: "Defines the X-component of the slicing vector, which determines the orientation of the slicing plane. A vector of {1, 0, 1}, when normalized, corresponds to a 45-degree tilt about the Y-axis. A vector of {1, 0, 0} is oriented along the positive X-axis, aligning the slicing plane parallel to the YZ plane (perpendicular to the X-axis)."
    depends: {}
    options: []
    default: 0
    minor: "Slicing"
    major: "Profile"
    namespace: "Profile::Slicing"
    symbol: "kSlicingVectorX"
    local: false
  - name: "slicing_vector_y"
    display: "Slicing Vector - Y"
    type: "unitless_float"
    tooltip: "Defines the Y-component of the slicing vector, which determines the orientation of the slicing plane. A vector of {0, 1, 1}, when normalized, corresponds to a 45-degree tilt about the X-axis. A vector of {0, 1, 0} is oriented along the positive Y-axis, aligning the slicing plane parallel to the XZ plane (perpendicular to the Y-axis)."
    depends: {}
    options: []
    default: 0
    minor: "Slicing"
    major: "Profile"
    namespace: "Profile::Slicing"
    symbol: "kSlicingVectorY"
    local: false
  - name: "slicing_vector_z"
    display: "Slicing Vector - Z"
    type: "unitless_float"
    tooltip: "Defines the Z-component of the slicing vector, which determines the orientation of the slicing plane. A vector of {0, 0, 1} is oriented along the positive Z-axis, aligning the slicing plane parallel to the XY plane (perpendicular to the Z-axis)."
    depends: {}
    options: []
    default: 1
    minor: "Slicing"
    major: "Profile"
    namespace: "Profile::Slicing"
    symbol: "kSlicingVectorZ"
    local: false
  - name: "helical_path_length"
    display: "Helical Path Length"
    type: "distance"
    tooltip: "The maximum length of the helical path before breaking the path "
    depends: {"slicer_type":3}
    options: []
    default: 0
    minor: "Slicing"
    major: "Profile"
    namespace: "Profile::Slicing"
    symbol: "kHelicalPathLength"
    local: false
  - name: "arcs_per_revolution"
    display: "Number of Arcs per Revolution"
    type: "positive_int"
    tooltip: "Total number of arcs per revolution. Values less than one use one arc."
    depends: {"OR":[{"slicer_type":2},{"slicer_type":3}]}
    options: []
    default: 1
    minor: "Slicing"
    major: "Profile"
    namespace: "Profile::Slicing"
    symbol: "kArcsPerRevolution"
    local: false
inputs:
  - name: "radial_axis"
    display: "Radial Axis"
    widget: "vector2"
    tooltip: "Defines the custom XY coordinate used as the radial cylinder axis when Radial Axis Mode is Custom XY."
    depends: {"AND":[{"slicer_type":2},{"radial_axis_mode":1}]}
    minor: "Slicing"
    major: "Profile"
    components:
      - setting: "radial_axis_x"
        label: "X"
      - setting: "radial_axis_y"
        label: "Y"
  - name: "slicing_vector"
    display: "Slicing Vector"
    widget: "vector3"
    tooltip: "Defines the slicing vector used as the slicing plane normal. Values are normalized before use; {0, 0, 1} produces horizontal XY layers, while tilted vectors produce angled slicing planes."
    depends: {}
    minor: "Slicing"
    major: "Profile"
    components:
      - setting: "slicing_vector_x"
        label: "X"
      - setting: "slicing_vector_y"
        label: "Y"
      - setting: "slicing_vector_z"
        label: "Z"
