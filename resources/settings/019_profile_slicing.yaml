# Canonical settings metadata for ORNLSlicer.
# Edit this file instead of resources/configs/master.conf.
settings:
  - name: "slicer_type"
    display: "Slicer Type"
    type: "enumeration"
    tooltip: "Selects the slicing engine to use"
    depends: {}
    options:
      - "Planar"
      - "Image"
      - "Cylindrical"
    default: 0
    minor: "Slicing"
    major: "Profile"
    namespace: "Profile::Slicing"
    symbol: "kSlicerType"
    local: false
  - name: "slicing_vector_x"
    display: "Slicing Vector - X"
    type: "unitless_float"
    tooltip: "Defines the X-component of the slicing vector, which determines the orientation of the slicing plane. A vector of {1, 0, 1}, when normalized, corresponds to a 45-degree tilt about the Y-axis. A vector of {1, 0, 0} is oriented along the positive X-axis, aligning the slicing plane parallel to the YZ plane (perpendicular to the X-axis)."
    depends: {"slicer_type":0}
    options: []
    default: 0
    minor: "Slicing"
    major: "Profile"
    namespace: "Profile::Slicing"
    symbol: "kSlicingVectorX"
    local: false
  - name: "slicing_vector_y"
    display: "Slicing Vector - Y"
    type: "unitless_float"
    tooltip: "Defines the Y-component of the slicing vector, which determines the orientation of the slicing plane. A vector of {0, 1, 1}, when normalized, corresponds to a 45-degree tilt about the X-axis. A vector of {0, 1, 0} is oriented along the positive Y-axis, aligning the slicing plane parallel to the XZ plane (perpendicular to the Y-axis)."
    depends: {"slicer_type":0}
    options: []
    default: 0
    minor: "Slicing"
    major: "Profile"
    namespace: "Profile::Slicing"
    symbol: "kSlicingVectorY"
    local: false
  - name: "slicing_vector_z"
    display: "Slicing Vector - Z"
    type: "unitless_float"
    tooltip: "Defines the Z-component of the slicing vector, which determines the orientation of the slicing plane. A vector of {0, 0, 1} is oriented along the positive Z-axis, aligning the slicing plane parallel to the XY plane (perpendicular to the Z-axis)."
    depends: {"slicer_type":0}
    options: []
    default: 1
    minor: "Slicing"
    major: "Profile"
    namespace: "Profile::Slicing"
    symbol: "kSlicingVectorZ"
    local: false
  - name: "radial_axis_mode"
    display: "Cylinder Axis Mode"
    type: "enumeration"
    tooltip: "Selects the XY axis used for cylindrical slicing. Part Centroid uses each build part's centroid, while Custom XY uses the configured cylinder axis coordinates."
    depends: {"slicer_type":2}
    options:
      - "Part Centroid"
      - "Custom XY"
    default: 0
    minor: "Slicing"
    major: "Profile"
    namespace: "Profile::Slicing"
    symbol: "kRadialAxisMode"
    local: true
  - name: "radial_axis_x"
    display: "Cylinder Axis X"
    type: "location"
    tooltip: "X coordinate for the cylinder axis when Cylinder Axis Mode is Custom XY."
    depends: {"AND":[{"slicer_type":2},{"radial_axis_mode":1}]}
    options: []
    default: 0
    minor: "Slicing"
    major: "Profile"
    namespace: "Profile::Slicing"
    symbol: "kRadialAxisX"
    local: true
  - name: "radial_axis_y"
    display: "Cylinder Axis Y"
    type: "location"
    tooltip: "Y coordinate for the cylinder axis when Cylinder Axis Mode is Custom XY."
    depends: {"AND":[{"slicer_type":2},{"radial_axis_mode":1}]}
    options: []
    default: 0
    minor: "Slicing"
    major: "Profile"
    namespace: "Profile::Slicing"
    symbol: "kRadialAxisY"
    local: true
  - name: "radial_initial_radius"
    display: "Initial Radius"
    type: "distance"
    tooltip: "Starting radius for cylindrical slicing. Values less than or equal to zero use half the layer height."
    depends: {"slicer_type":2}
    options: []
    default: 0
    minor: "Slicing"
    major: "Profile"
    namespace: "Profile::Slicing"
    symbol: "kRadialInitialRadius"
    local: true
  - name: "cylindrical_path_type"
    display: "Path Type"
    type: "enumeration"
    tooltip: "Selects whether cylindrical slicing generates radial rings or helical paths."
    depends: {"slicer_type":2}
    options:
      - "Radial"
      - "Helical"
    default: 0
    minor: "Slicing"
    major: "Profile"
    namespace: "Profile::Slicing"
    symbol: "kCylindricalPathType"
    local: false
  - name: "radial_boundary_handling"
    display: "Boundary Handling"
    type: "enumeration"
    tooltip: "Controls radial paths that cross the model boundary. Clip keeps model-retained portions, Keep outputs the original boundary-crossing path when any portion is inside, and Discard omits paths cut by the model boundary."
    depends: {"AND":[{"slicer_type":2},{"cylindrical_path_type":0}]}
    options:
      - "Clip"
      - "Keep"
      - "Discard"
    default: 0
    minor: "Slicing"
    major: "Profile"
    namespace: "Profile::Slicing"
    symbol: "kRadialBoundaryHandling"
    local: true
  - name: "helical_boundary_handling"
    display: "Boundary Handling"
    type: "enumeration"
    tooltip: "Controls helical paths that cross the model boundary. Clip keeps every retained model intersection, and Clip Z keeps the continuous helix through the highest Z model intersection."
    depends: {"AND":[{"slicer_type":2},{"cylindrical_path_type":1}]}
    options:
      - "Clip"
      - "Clip Z"
    default: 0
    minor: "Slicing"
    major: "Profile"
    namespace: "Profile::Slicing"
    symbol: "kHelicalBoundaryHandling"
    local: true
  - name: "helical_path_length"
    display: "Helical Path Length"
    type: "distance"
    tooltip: "Maximum length of each generated helical path before it is split. Set to 0 to leave helical paths unbroken."
    depends: {"AND":[{"slicer_type":2},{"cylindrical_path_type":1}]}
    options: []
    default: 0
    minor: "Slicing"
    major: "Profile"
    namespace: "Profile::Slicing"
    symbol: "kHelicalPathLength"
    local: false
  - name: "arcs_per_revolution"
    display: "Number of Arcs per Revolution"
    type: "positive_int"
    tooltip: "Total number of arcs per revolution. Values less than one use one arc."
    depends: {"slicer_type":2}
    options: []
    default: 1
    minor: "Slicing"
    major: "Profile"
    namespace: "Profile::Slicing"
    symbol: "kArcsPerRevolution"
    local: false
  - name: "image_resolution_x"
    display: "Image Resolution X"
    type: "distance"
    tooltip: "Resolution in x dimension of images created using the image kernel"
    depends: {"slicer_type":1}
    options: []
    default: 0
    minor: "Slicing"
    major: "Profile"
    namespace: "Profile::Slicing"
    symbol: "kImageResolutionX"
    local: false
  - name: "image_resolution_y"
    display: "Image Resolution Y"
    type: "distance"
    tooltip: "Resolution in y dimension of images created using the image kernel"
    depends: {"slicer_type":1}
    options: []
    default: 0
    minor: "Slicing"
    major: "Profile"
    namespace: "Profile::Slicing"
    symbol: "kImageResolutionY"
    local: false
inputs:
  - name: "radial_axis"
    display: "Cylinder Axis"
    widget: "vector2"
    tooltip: "Defines the custom XY coordinate used as the cylinder axis when Cylinder Axis Mode is Custom XY."
    depends: {"AND":[{"slicer_type":2},{"radial_axis_mode":1}]}
    minor: "Slicing"
    major: "Profile"
    components:
      - setting: "radial_axis_x"
        label: "X"
      - setting: "radial_axis_y"
        label: "Y"
  - name: "slicing_vector"
    display: "Slicing Vector"
    widget: "vector3"
    tooltip: "Defines the slicing vector used as the slicing plane normal. Values are normalized before use; {0, 0, 1} produces horizontal XY layers, while tilted vectors produce angled slicing planes."
    depends: {"slicer_type":0}
    minor: "Slicing"
    major: "Profile"
    components:
      - setting: "slicing_vector_x"
        label: "X"
      - setting: "slicing_vector_y"
        label: "Y"
      - setting: "slicing_vector_z"
        label: "Z"
