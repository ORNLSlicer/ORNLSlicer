  - name: "helical_perimeter_tool_frame_x_rotation"
    display: "Perimeter Tool Frame - X Rotation"
    type: "angle"
    tooltip: "X rotation of the tool frame for perimeter region"
    depends: {"AND":[{"slicing_mode":1},{"AND":[{"cylindrical_path_pattern":1},{"NOT":[{"helical_perimeter_revolutions":0}]}]}]}
