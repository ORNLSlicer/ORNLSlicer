# Canonical settings metadata for ORNLSlicer.
# Edit this file instead of resources/configs/master.conf.
settings:
  - name: "helical_path_handedness"
    display: "Helical Path Handedness"
    type: "enumeration"
    tooltip: "Selects the handedness for generated helical paths. Right Handed uses a counter-clockwise XY sweep as Z rises. Left Handed mirrors the sweep clockwise while preserving positive Z rise."
    depends: {"AND":[{"slicing_mode":1},{"cylindrical_path_pattern":1}]}
    options:
      - "Right Handed"
      - "Left Handed"
    default: 0
    minor: "Helical"
    major: "Profile"
    namespace: "Profile::Helical"
    symbol: "kHelicalPathHandedness"
    local: true
  - name: "helical_start_angle_offset"
    display: "Helical Start Angle Offset"
    type: "angle"
    tooltip: "Angular offset from top dead center for each generated helical path start. 0 degrees starts on +Y; positive values rotate counter-clockwise and negative values rotate clockwise."
    depends: {"AND":[{"slicing_mode":1},{"cylindrical_path_pattern":1}]}
    options: []
    default: 0
    minor: "Helical"
    major: "Profile"
    namespace: "Profile::Helical"
    symbol: "kHelicalStartAngleOffset"
    local: true
  - name: "helical_path_z_clip_rounding"
    display: "Helical Z Clip Rounding"
    type: "enumeration"
    tooltip: "Controls how helical path z clipping rounds the endpoint at the highest model intersection. Exact Intersection stops at the intersection. Complete Revolution continues to the next full revolution. Last Full Revolution stops at the previous full revolution."
    depends: {"AND":[{"slicing_mode":1},{"cylindrical_path_pattern":1}]}
    options:
      - "Exact Intersection"
      - "Complete Revolution"
      - "Last Full Revolution"
    default: 0
    minor: "Helical"
    major: "Profile"
    namespace: "Profile::Helical"
    symbol: "kHelicalPathZClipRounding"
    local: true
  - name: "helical_perimeter_revolutions"
    display: "Perimeter Revolutions"
    type: "non_negative_int"
    tooltip: "Number of revolutions for perimeter region"
    depends: {"AND":[{"slicing_mode":1},{"cylindrical_path_pattern":1}]}
    options: []
    default: 0
    minor: "Helical"
    major: "Profile"
    namespace: "Profile::Helical"
    symbol: "kHelicalPerimeterRevolutions"
    local: false
  - name: "helical_inset_revolutions"
    display: "Inset Revolutions"
    type: "non_negative_int"
    tooltip: "Number of revolutions for inset region"
    depends: {"AND":[{"slicing_mode":1},{"cylindrical_path_pattern":1}]}
    options: []
    default: 0
    minor: "Helical"
    major: "Profile"
    namespace: "Profile::Helical"
    symbol: "kHelicalInsetRevolutions"
    local: false
  - name: "helical_infill_revolutions_rounding"
    display: "Infill Revolutions Rounding Policy"
    type: "enumeration"
    tooltip: "Rounding policy for the number of revolutions for helical infill region. This is used to ensure that the number of revolutions is an integer value."
    depends: {"AND":[{"slicing_mode":1},{"cylindrical_path_pattern":1}]}
    options:
      - "Round"
      - "Floor"
      - "Ceil"
    default: 0
    minor: "Helical"
    major: "Profile"
    namespace: "Profile::Helical"
    symbol: "kHelicalInfillRevolutionsRounding"
    local: false
  - name: "helical_perimeter_stepover"
    display: "Perimeter Stepover"
    type: "distance"
    tooltip: "Step over distance for perimeter region"
    depends: {"AND":[{"slicing_mode":1},{"AND":[{"cylindrical_path_pattern":1},{"NOT":[{"helical_perimeter_revolutions":0}]}]}]}
    options: []
    default: 0
    minor: "Helical"
    major: "Profile"
    namespace: "Profile::Helical"
    symbol: "kHelicalPerimeterStepover"
    local: false
  - name: "helical_inset_stepover"
    display: "Inset Stepover"
    type: "distance"
    tooltip: "Step over distance for inset region"
    depends: {"AND":[{"slicing_mode":1},{"AND":[{"cylindrical_path_pattern":1},{"NOT":[{"helical_inset_revolutions":0}]}]}]}
