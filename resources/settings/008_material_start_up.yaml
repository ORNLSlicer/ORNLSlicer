# Canonical settings metadata for ORNLSlicer.
# Edit this file instead of resources/configs/master.conf.
settings:
  - name: "perimeter_start-up"
    display: "Enable Perimeter Start-Up"
    type: "boolean"
    tooltip: "If selected, will move at a slower speed for a certain distance at the beginning of a perimeter path"
    depends: {"perimeter":true}
    options: []
    default: false
    minor: "Start-Up"
    major: "Material"
    namespace: "Material::StartUp"
    symbol: "kEnablePerimeterStartUp"
    local: true
  - name: "perimeter_start-up_distance"
    display: "Perimeter Start-Up Distance"
    type: "distance"
    tooltip: "Distance for the perimeter start-up move"
    depends: {"AND":[{"perimeter":true},{"perimeter_start-up":true}]}
    options: []
    default: 0
    minor: "Start-Up"
    major: "Material"
    namespace: "Material::StartUp"
    symbol: "kPerimeterStartUpDistance"
    local: true
  - name: "perimeter_start-up_speed"
    display: "Perimeter Start-Up Speed"
    type: "speed"
    tooltip: "Speed for the perimeter start-up move"
    depends: {"AND":[{"perimeter":true},{"perimeter_start-up":true}]}
    options: []
    default: 0
    minor: "Start-Up"
    major: "Material"
    namespace: "Material::StartUp"
    symbol: "kPerimeterStartUpSpeed"
    local: true
  - name: "perimeter_start-up_extruder_speed"
    display: "Perimeter Start-Up Extruder Speed"
    type: "rpm"
    tooltip: "Extruder Speed for the perimeter start-up move"
    depends: {"AND":[{"perimeter":true},{"AND":[{"perimeter_start-up":true},{"enable_width_height":false}]}]}
    options: []
    default: 0
    minor: "Start-Up"
    major: "Material"
    namespace: "Material::StartUp"
    symbol: "kPerimeterStartUpExtruderSpeed"
    local: true
  - name: "perimeter_start-up_ramp-up"
    display: "Enable Perimeter Start-Up Ramp-Up"
    type: "boolean"
    tooltip: "If selected, will ramp-up the extruder speed from the Perimeter Start-Up Extruder Speed to the Perimeter Speed using short segments of increasing RPM"
    depends: {"AND":[{"perimeter":true},{"perimeter_start-up":true}]}
    options: []
    default: false
    minor: "Start-Up"
    major: "Material"
    namespace: "Material::StartUp"
    symbol: "kEnablePerimeterStartUpRampUp"
    local: true
  - name: "perimeter_start-up_steps"
    display: "Perimeter Start-Up Ramp-Up Steps"
    type: "positive_int"
    tooltip: "Numbers of steps to take while ramping up the extruder speed during perimeter start-up paths"
    depends: {"AND":[{"perimeter":true},{"AND":[{"perimeter_start-up_ramp-up":true},{"perimeter_start-up":true}]}]}
    options: []
    default: 1
    minor: "Start-Up"
    major: "Material"
    namespace: "Material::StartUp"
    symbol: "kPerimeterStartUpRampUpSteps"
    local: true
