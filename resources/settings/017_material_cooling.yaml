# Canonical settings metadata for ORNLSlicer.
# Edit this file instead of resources/configs/master.conf.
settings:
  - name: "fan"
    display: "Fan Control"
    type: "boolean"
    tooltip: "Sets how and when the fan will operate"
    depends: {"AND":[{"slicing_mode":0},{"machine_type":1}]}
    options: []
    default: false
    minor: "Cooling"
    major: "Material"
    namespace: "Material::Cooling"
    symbol: "kFanControl"
    local: false
  - name: "fan_min_speed"
    display: "Min Fan Speed"
    type: "percentage100"
    tooltip: "Minimum speed the fan will be on"
    depends: {"AND":[{"slicing_mode":0},{"AND":[{"machine_type":1},{"fan":true}]}]}
    options: []
    default: 0
    minor: "Cooling"
    major: "Material"
    namespace: "Material::Cooling"
    symbol: "kMinFanSpeed"
    local: false
  - name: "fan_max_speed"
    display: "Max Fan Speed"
    type: "percentage100"
    tooltip: "Maximum speed the fan will be on"
    depends: {"AND":[{"slicing_mode":0},{"AND":[{"machine_type":1},{"fan":true}]}]}
    options: []
    default: 0
    minor: "Cooling"
    major: "Material"
    namespace: "Material::Cooling"
    symbol: "kMaxFanSpeed"
    local: false
  - name: "force_minimum_layer_time"
    display: "Force Min / Max Layer Time"
    type: "boolean"
    tooltip: "If selected, a min / max layer time is reinforced for each layer so that there is adequate time for cooling"
    depends: {"AND":[{"slicing_mode":0},{"NOT":[{"machine_type":6}]}]}
    options: []
    default: false
    minor: "Cooling"
    major: "Material"
    namespace: "Material::Cooling"
    symbol: "kForceMinMaxLayerTime"
    local: false
  - name: "minimum_layer_time_method"
    display: "Min / Max Layer Time Method"
    type: "enumeration"
    tooltip: "Choose one of two ways to meet the min / max layer time requirement: either add dwell time or adjust feed rate in G0 G1 lines"
    depends: {"AND":[{"slicing_mode":0},{"force_minimum_layer_time":true}]}
    options:
      - "ADD DWELL TIME"
      - "MODIFY FEEDRATE"
    default: 0
    minor: "Cooling"
    major: "Material"
    namespace: "Material::Cooling"
    symbol: "kMinMaxLayerTimeMethod"
    local: false
  - name: "minimum_layer_time"
    display: "Minimum Layer Time"
    type: "time"
    tooltip: "The minimum layer time required to meet the cooling need"
    depends: {"AND":[{"slicing_mode":0},{"force_minimum_layer_time":true}]}
    options: []
    default: 0
    minor: "Cooling"
    major: "Material"
    namespace: "Material::Cooling"
    symbol: "kMinimumLayerTime"
    local: false
  - name: "maximum_layer_time"
    display: "Maximum Layer Time"
    type: "time"
    tooltip: "The maximum layer time required to meet the cooling need"
    depends: {"AND":[{"slicing_mode":0},{"AND":[{"force_minimum_layer_time":true},{"minimum_layer_time_method":1}]}]}
    options: []
    default: 0
    minor: "Cooling"
    major: "Material"
    namespace: "Material::Cooling"
    symbol: "kMaximumLayerTime"
    local: false
  - name: "extruder_scale_factor"
    display: "Extruder Scale Factor"
    type: "unitless_float"
    tooltip: "Scale factor to be applied to extruder commands when adjusting feedrate. Value of 1 has no effect, greater than 1 increases extruder speed, and less than 1 decreases speed."
    depends: {"AND":[{"slicing_mode":0},{"AND":[{"force_minimum_layer_time":true},{"minimum_layer_time_method":1}]}]}
    options: []
    default: 1
    minor: "Cooling"
    major: "Material"
    namespace: "Material::Cooling"
    symbol: "kExtruderScaleFactor"
    local: false
  - name: "pre_pause_code"
    display: "Pre Pause G-Code"
    type: "multiline_text"
    tooltip: "G-Code to be executed before the minimum layer time pause command, such as moving to a location to purge"
    depends: {"AND":[{"slicing_mode":0},{"AND":[{"force_minimum_layer_time":true},{"minimum_layer_time_method":0}]}]}
    options: []
    default: ""
    minor: "Cooling"
    major: "Material"
    namespace: "Material::Cooling"
    symbol: "kPrePauseGCode"
    local: false
  - name: "post_pause_code"
    display: "Post Pause G-Code"
    type: "multiline_text"
    tooltip: "G-Code to be executed after the minimum layer time pause command, such as turning an extruder off"
    depends: {"AND":[{"slicing_mode":0},{"AND":[{"force_minimum_layer_time":true},{"minimum_layer_time_method":0}]}]}
    options: []
    default: ""
    minor: "Cooling"
    major: "Material"
    namespace: "Material::Cooling"
    symbol: "kPostPauseGCode"
    local: false
