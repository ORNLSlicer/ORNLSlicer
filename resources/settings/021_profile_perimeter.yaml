# Canonical settings metadata for ORNLSlicer.
# Edit this file instead of resources/configs/master.conf.
settings:
  - name: "perimeter"
    display: "Enable Perimeter"
    type: "boolean"
    tooltip: "If selected, perimeters will be generated"
    depends: {"slicing_mode":0}
    options: []
    default: false
    minor: "Perimeter"
    major: "Profile"
    namespace: "Profile::Perimeter"
    symbol: "kEnablePerimeter"
    local: true
  - name: "perimeter_count"
    display: "Number of Perimeters"
    type: "positive_int"
    tooltip: "Sets the number of exterior contour paths generated per layer. The editor accepts 1 or more; the built-in catalog fallback is 0, so set an explicit value before enabling perimeters."
    depends: {"AND":[{"slicing_mode":0},{"perimeter":true}]}
    options: []
    default: 0
    minor: "Perimeter"
    major: "Profile"
    namespace: "Profile::Perimeter"
    symbol: "kNumberofPerimeters"
    local: true
  - name: "perimeter_boundary_selection"
    display: "Perimeter Boundaries"
    type: "enumeration"
    tooltip: "Selects which polygon boundaries are used to generate perimeter paths."
    depends: {"AND":[{"slicing_mode":0},{"perimeter":true}]}
    options:
      - "All Boundaries"
      - "Internal Boundaries"
      - "External Boundaries"
    default: 0
    minor: "Perimeter"
    major: "Profile"
    namespace: "Profile::Perimeter"
    symbol: "kPerimeterBoundarySelection"
    local: true
  - name: "perimeter_width"
    display: "Perimeter Bead Width"
    type: "distance"
    tooltip: "Bead width for perimeter paths"
    depends: {"AND":[{"slicing_mode":0},{"perimeter":true}]}
    options: []
    default: 0
    minor: "Perimeter"
    major: "Profile"
    namespace: "Profile::Perimeter"
    symbol: "kPerimeterBeadWidth"
    local: true
  - name: "perimeter_adapt"
    display: "Enable Adaptive Perimeter Bead Widths"
    type: "boolean"
    tooltip: "If selected, perimeter bead widths are adjusted within the configured limits to better fill narrow regions whose remaining contour space is not an exact multiple of the nominal bead width."
    depends: {"AND":[{"slicing_mode":0},{"perimeter":true}]}
    options: []
    default: false
    minor: "Perimeter"
    major: "Profile"
    namespace: "Profile::Perimeter"
    symbol: "kEnableAdaptiveBeadWidths"
    local: false
  - name: "perimeter_adapt_min_width"
    display: "Minimum Adaptive Perimeter Bead Width"
    type: "distance"
    tooltip: "Minimum bead width allowed when adaptive perimeter bead widths are enabled."
    depends: {"AND":[{"slicing_mode":0},{"AND":[{"perimeter":true},{"perimeter_adapt":true}]}]}
    options: []
    default: 0
    minor: "Perimeter"
    major: "Profile"
    namespace: "Profile::Perimeter"
    symbol: "kMinimumAdaptiveBeadWidth"
    local: false
  - name: "perimeter_adapt_max_width"
    display: "Maximum Adaptive Perimeter Bead Width"
    type: "distance"
    tooltip: "Maximum bead width allowed when adaptive perimeter bead widths are enabled."
    depends: {"AND":[{"slicing_mode":0},{"AND":[{"perimeter":true},{"perimeter_adapt":true}]}]}
    options: []
    default: 10000
    minor: "Perimeter"
    major: "Profile"
    namespace: "Profile::Perimeter"
    symbol: "kMaximumAdaptiveBeadWidth"
    local: false
  - name: "perimeter_speed"
    display: "Perimeter Speed"
    type: "speed"
    tooltip: "Speed for perimeter paths"
    depends: {"AND":[{"slicing_mode":0},{"perimeter":true}]}
    options: []
    default: 0
    minor: "Perimeter"
    major: "Profile"
    namespace: "Profile::Perimeter"
    symbol: "kPerimeterSpeed"
    local: true
  - name: "perimeter_extruder_speed"
    display: "Perimeter Extruder Speed"
    type: "rpm"
    tooltip: "Extruder speed for perimeter paths"
    depends: {"AND":[{"slicing_mode":0},{"AND":[{"perimeter":true},{"AND":[{"enable_width_height":false},{"OR":[{"machine_type":0},{"OR":[{"machine_type":4},{"machine_type":5}]}]}]}]}]}
    options: []
    default: 0
    minor: "Perimeter"
    major: "Profile"
    namespace: "Profile::Perimeter"
    symbol: "kPerimeterExtruderSpeed"
    local: true
  - name: "perimeter_extrusion_multiplier"
    display: "Perimeter Extrusion Multiplier"
    type: "unitless_float"
    tooltip: "Extrusion multiplier to increase/decrease flowrate for perimeter paths for systems without RPM control"
    depends: {"AND":[{"slicing_mode":0},{"AND":[{"perimeter":true},{"OR":[{"machine_type":1},{"syntax":26}]}]}]}
    options: []
    default: 1
    minor: "Perimeter"
    major: "Profile"
    namespace: "Profile::Perimeter"
    symbol: "kPerimeterExtrusionMultiplier"
    local: true
  - name: "perimeter_minimum_path_length"
    display: "Minimum Perimeter Path Length"
    type: "distance"
    tooltip: "Perimeter extrusion paths less than this value are deleted"
    depends: {"AND":[{"slicing_mode":0},{"perimeter":true}]}
    options: []
    default: 0
    minor: "Perimeter"
    major: "Profile"
    namespace: "Profile::Perimeter"
    symbol: "kMinimumPerimeterPathLength"
    local: true
  - name: "perimeter_minimum_segment_length"
    display: "Minimum Perimeter Segment Length"
    type: "distance"
    tooltip: "Perimeter path segments shorter than this value are collapsed before extrusion paths are created"
    depends: {"AND":[{"slicing_mode":0},{"perimeter":true}]}
    options: []
    default: 0
    minor: "Perimeter"
    major: "Profile"
    namespace: "Profile::Perimeter"
    symbol: "kMinimumPerimeterSegmentLength"
    local: true
  - name: "perimeter_lead_in"
    display: "Enable Perimeter Lead-In"
    type: "boolean"
    tooltip: "If selected, a lead-in path segment is added to the first perimeter path that can be used to prime the extruder"
    depends: {"AND":[{"slicing_mode":0},{"perimeter":true}]}
    options: []
    default: false
    minor: "Perimeter"
    major: "Profile"
    namespace: "Profile::Perimeter"
    symbol: "kEnablePerimeterLeadIn"
    local: true
  - name: "perimeter_lead_in_first_layer"
    display: "Lead-In on First Layer Only"
    type: "boolean"
    tooltip: "If selected, lead-in is only applied to layer 1."
    depends: {"AND":[{"slicing_mode":0},{"AND":[{"perimeter":true},{"perimeter_lead_in":true}]}]}
    options: []
    default: true
    minor: "Perimeter"
    major: "Profile"
    namespace: "Profile::Perimeter"
    symbol: "kLeadInonFirstLayerOnly"
    local: false
  - name: "perimeter_lead_in_x"
    display: "Lead-In Point X Position"
    type: "distance"
    tooltip: "X Position for the start of the perimeter lead-in segment"
    depends: {"AND":[{"slicing_mode":0},{"AND":[{"perimeter":true},{"perimeter_lead_in":true}]}]}
    options: []
    default: 0
    minor: "Perimeter"
    major: "Profile"
    namespace: "Profile::Perimeter"
    symbol: "kLeadInPointXPosition"
    local: true
  - name: "perimeter_lead_in_y"
    display: "Lead-In Point Y Position"
    type: "distance"
    tooltip: "Y Position for the start of the perimeter lead-in segment"
    depends: {"AND":[{"slicing_mode":0},{"AND":[{"perimeter":true},{"perimeter_lead_in":true}]}]}
    options: []
    default: 0
    minor: "Perimeter"
    major: "Profile"
    namespace: "Profile::Perimeter"
    symbol: "kLeadInPointYPosition"
    local: true
  - name: "perimeter_flying_start"
    display: "Enable Perimeter Flying Start"
    type: "boolean"
    tooltip: "If selected, motions are created prior to the first extrusion move such that the end effector is in motion at the start of the path."
    depends: {"AND":[{"slicing_mode":0},{"perimeter":true}]}
    options: []
    default: false
    minor: "Perimeter"
    major: "Profile"
    namespace: "Profile::Perimeter"
    symbol: "kEnablePerimeterFlyingStart"
    local: true
  - name: "perimeter_flying_start_distance"
    display: "Perimeter Flying Start Distance"
    type: "distance"
    tooltip: "Distance away from the start of the extrusion path to begin the flying start motion."
    depends: {"AND":[{"slicing_mode":0},{"AND":[{"perimeter":true},{"perimeter_flying_start":true}]}]}
    options: []
    default: 0
    minor: "Perimeter"
    major: "Profile"
    namespace: "Profile::Perimeter"
    symbol: "kPerimeterFlyingStartDistance"
    local: true
  - name: "perimeter_flying_start_speed"
    display: "Perimeter Flying Start Speed"
    type: "speed"
    tooltip: "Speed for the flying start motion."
    depends: {"AND":[{"slicing_mode":0},{"AND":[{"perimeter":true},{"perimeter_flying_start":true}]}]}
    options: []
    default: 0
    minor: "Perimeter"
    major: "Profile"
    namespace: "Profile::Perimeter"
    symbol: "kPerimeterFlyingStartSpeed"
    local: true
  - name: "spiral_perimeter"
    display: "Enable Spiral Perimeter"
    type: "boolean"
    tooltip: "If selected, spiral perimeters will be generated.<br><br><img src=':/tooltips/profile/spiral_perimeter.png' width='260' height='146'>"
    depends: {"AND":[{"slicing_mode":0},{"perimeter":true}]}
    options: []
    default: false
    minor: "Perimeter"
    major: "Profile"
    namespace: "Profile::Perimeter"
    symbol: "kEnableSpiralPerimeter"
    local: true
