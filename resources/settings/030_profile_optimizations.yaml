# Canonical settings metadata for ORNLSlicer.
# Edit this file instead of resources/configs/master.conf.
settings:
  - name: "layer_ordering"
    display: "Layer Ordering"
    type: "enumeration"
    tooltip: "How to order layers across multiple parts"
    depends: {"slicing_mode":0}
    options:
      - "By Height"
      - "By Layer Number"
      - "By Part (Sequential)"
    default: 0
    minor: "Optimizations"
    major: "Profile"
    namespace: "Profile::Optimizations"
    symbol: "kLayerOrdering"
    local: false
  - name: "layer_grouping_tolerance"
    display: "Layer Grouping Tolerance"
    type: "distance"
    tooltip: "Layers with local heights along their slicing plane normals that differ by less than this value will be assigned to the same global layer."
    depends: {"AND":[{"slicing_mode":0},{"layer_ordering":0}]}
    options: []
    default: 1
    minor: "Optimizations"
    major: "Profile"
    namespace: "Profile::Optimizations"
    symbol: "kLayerGroupingTolerance"
    local: false
  - name: "island_order_optimization"
    display: "Island Order Optimization"
    type: "enumeration"
    tooltip: "Type of order optimizer to use on islands"
    depends: {"slicing_mode":0}
    options:
      - "Next Closest"
      - "Next Farthest"
      - "Shortest Distance (approximate)"
      - "Shortest Distance (brute force)"
      - "Least Recently Visited"
      - "Random"
      - "Custom Location"
    default: 0
    minor: "Optimizations"
    major: "Profile"
    namespace: "Profile::Optimizations"
    symbol: "kIslandOrderOptimization"
    local: true
  - name: "custom_island_order_x_location"
    display: "Custom Island Point X Location"
    type: "location"
    tooltip: "X Coordinate for Custom Point Optimization Location"
    depends: {"AND":[{"slicing_mode":0},{"island_order_optimization":6}]}
    options: []
    default: 0
    minor: "Optimizations"
    major: "Profile"
    namespace: "Profile::Optimizations"
    symbol: "kCustomIslandPointXLocation"
    local: true
  - name: "custom_island_order_y_location"
    display: "Custom Island Point Y Location"
    type: "location"
    tooltip: "Y Coordinate for Custom Point Optimization Location"
    depends: {"AND":[{"slicing_mode":0},{"island_order_optimization":6}]}
    options: []
    default: 0
    minor: "Optimizations"
    major: "Profile"
    namespace: "Profile::Optimizations"
    symbol: "kCustomIslandPointYLocation"
    local: true
  - name: "custom_island_order_z_location"
    display: "Custom Island Point Z Location"
    type: "location"
    tooltip: "Z Coordinate for Custom Point Optimization Location"
    depends: {"AND":[{"slicing_mode":0},{"island_order_optimization":6}]}
    options: []
    default: 0
    minor: "Optimizations"
    major: "Profile"
    namespace: "Profile::Optimizations"
    symbol: "kCustomIslandPointZLocation"
    local: true
  - name: "path_order_optimization"
    display: "Path Order Optimization"
    type: "enumeration"
    tooltip: "Type of order optimizer to use on paths"
    depends: {"slicing_mode":0}
    options:
      - "Next Closest"
      - "Next Farthest"
      - "Random"
      - "Outside In"
      - "Inside Out"
      - "Custom Location"
    default: 0
    minor: "Optimizations"
    major: "Profile"
    namespace: "Profile::Optimizations"
    symbol: "kPathOrderOptimization"
    local: true
  - name: "perimeter_path_order_optimization"
    display: "Perimeter Path Order Optimization"
    type: "enumeration"
    tooltip: "Type of order optimizer to use on perimeter paths. Use Global follows Path Order Optimization."
    depends: {"AND":[{"slicing_mode":0},{"perimeter":true}]}
    options:
      - "Use Global"
      - "Next Closest"
      - "Next Farthest"
      - "Random"
      - "Outside In"
      - "Inside Out"
      - "Custom Location"
    default: 0
    minor: "Optimizations"
    major: "Profile"
    namespace: "Profile::Optimizations"
    symbol: "kPerimeterPathOrderOptimization"
    local: true
  - name: "inset_path_order_optimization"
    display: "Inset Path Order Optimization"
    type: "enumeration"
    tooltip: "Type of order optimizer to use on inset paths. Use Global follows Path Order Optimization."
    depends: {"AND":[{"slicing_mode":0},{"inset":true}]}
    options:
      - "Use Global"
      - "Next Closest"
      - "Next Farthest"
      - "Random"
      - "Outside In"
      - "Inside Out"
      - "Custom Location"
    default: 0
    minor: "Optimizations"
    major: "Profile"
    namespace: "Profile::Optimizations"
    symbol: "kInsetPathOrderOptimization"
    local: true
  - name: "skin_path_order_optimization"
    display: "Skin Path Order Optimization"
    type: "enumeration"
    tooltip: "Type of order optimizer to use on skin paths. Use Global follows Path Order Optimization."
    depends: {"AND":[{"slicing_mode":0},{"skin":true}]}
    options:
      - "Use Global"
      - "Next Closest"
      - "Next Farthest"
      - "Random"
      - "Outside In"
      - "Inside Out"
      - "Custom Location"
    default: 0
    minor: "Optimizations"
    major: "Profile"
    namespace: "Profile::Optimizations"
    symbol: "kSkinPathOrderOptimization"
    local: true
  - name: "custom_path_order_x_location"
    display: "Custom Path Point X Location"
    type: "location"
    tooltip: "X Coordinate for Custom Point Optimization Location"
    depends: {"AND":[{"slicing_mode":0},{"OR":[{"path_order_optimization":5},{"OR":[{"perimeter_path_order_optimization":6},{"OR":[{"inset_path_order_optimization":6},{"skin_path_order_optimization":6}]}]}]}]}
    options: []
    default: 0
    minor: "Optimizations"
    major: "Profile"
    namespace: "Profile::Optimizations"
    symbol: "kCustomPathPointXLocation"
    local: true
  - name: "custom_path_order_y_location"
    display: "Custom Path Point Y Location"
    type: "location"
    tooltip: "Y Coordinate for Custom Point Optimization Location"
    depends: {"AND":[{"slicing_mode":0},{"OR":[{"path_order_optimization":5},{"OR":[{"perimeter_path_order_optimization":6},{"OR":[{"inset_path_order_optimization":6},{"skin_path_order_optimization":6}]}]}]}]}
    options: []
    default: 0
    minor: "Optimizations"
    major: "Profile"
    namespace: "Profile::Optimizations"
    symbol: "kCustomPathPointYLocation"
    local: true
  - name: "custom_path_order_z_location"
    display: "Custom Path Point Z Location"
    type: "location"
    tooltip: "Z Coordinate for Custom Point Optimization Location"
    depends: {"AND":[{"slicing_mode":0},{"OR":[{"path_order_optimization":5},{"OR":[{"perimeter_path_order_optimization":6},{"OR":[{"inset_path_order_optimization":6},{"skin_path_order_optimization":6}]}]}]}]}
    options: []
    default: 0
    minor: "Optimizations"
    major: "Profile"
    namespace: "Profile::Optimizations"
    symbol: "kCustomPathPointZLocation"
    local: true
  - name: "point_order_optimization"
    display: "Point Order Optimization"
    type: "enumeration"
    tooltip: "Type of order optimizer to use on point selection after a path has been determined"
    depends: {"slicing_mode":0}
    options:
      - "Next Closest"
      - "Next Farthest"
      - "Random"
      - "Consecutive"
      - "Custom Location"
      - "Custom Farthest Location"
    default: 0
    minor: "Optimizations"
    major: "Profile"
    namespace: "Profile::Optimizations"
    symbol: "kPointOrderOptimization"
    local: true
  - name: "enable_point_order_segment_breaking"
    display: "Enable Point Order Segment Breaking"
    type: "boolean"
    tooltip: "Allows point order optimization to split a closed contour segment so the seam can start at the closest point along an edge."
    depends: {"AND":[{"slicing_mode":0},{"OR":[{"point_order_optimization":0},{"point_order_optimization":4}]}]}
    options: []
    default: false
    minor: "Optimizations"
    major: "Profile"
    namespace: "Profile::Optimizations"
    symbol: "kEnablePointOrderSegmentBreaking"
    local: true
  - name: "local_randomness_enable"
    display: "Enable Local Randomness"
    type: "boolean"
    tooltip: "Enables local randomness within a specified radius after the selected point optimization scheme"
    depends: {"slicing_mode":0}
    options: []
    default: false
    minor: "Optimizations"
    major: "Profile"
    namespace: "Profile::Optimizations"
    symbol: "kEnableLocalRandomness"
    local: true
  - name: "local_randomness_radius"
    display: "Local Randomness Radius"
    type: "distance"
    tooltip: "Radius within which the travel connection will be randomized after having computed connectivity via point optimization scheme"
    depends: {"AND":[{"slicing_mode":0},{"local_randomness_enable":true}]}
    options: []
    default: 0
    minor: "Optimizations"
    major: "Profile"
    namespace: "Profile::Optimizations"
    symbol: "kLocalRandomnessRadius"
    local: true
  - name: "enable_min_distance"
    display: "Enable Minimum Distance"
    type: "boolean"
    tooltip: "Enables a minimum distance threshold when using next closest point optimization"
    depends: {"AND":[{"slicing_mode":0},{"point_order_optimization":0}]}
    options: []
    default: false
    minor: "Optimizations"
    major: "Profile"
    namespace: "Profile::Optimizations"
    symbol: "kEnableMinimumDistance"
    local: true
  - name: "min_distance_threshold"
    display: "Minimum Distance Threshold"
    type: "distance"
    tooltip: "Minimum distance that a point must be when selected via next closest point optimization. If none are found, furthest point is selected."
    depends: {"AND":[{"slicing_mode":0},{"AND":[{"point_order_optimization":0},{"enable_min_distance":true}]}]}
    options: []
    default: 0
    minor: "Optimizations"
    major: "Profile"
    namespace: "Profile::Optimizations"
    symbol: "kMinimumDistanceThreshold"
    local: true
  - name: "consecutive_distance_threshold"
    display: "Consecutive Distance Threshold"
    type: "distance"
    tooltip: "Sets minimum distance to rotate consecutive point layer to layer"
    depends: {"AND":[{"slicing_mode":0},{"point_order_optimization":3}]}
    options: []
    default: 0
    minor: "Optimizations"
    major: "Profile"
    namespace: "Profile::Optimizations"
    symbol: "kConsecutiveDistanceThreshold"
    local: true
  - name: "custom_point_order_x_location"
    display: "Custom Point X Location"
    type: "location"
    tooltip: "X Coordinate for Custom Point for Point Optimization Scheme"
    depends: {"AND":[{"slicing_mode":0},{"OR":[{"point_order_optimization":4},{"point_order_optimization":5}]}]}
    options: []
    default: 0
    minor: "Optimizations"
    major: "Profile"
    namespace: "Profile::Optimizations"
    symbol: "kCustomPointXLocation"
    local: true
  - name: "custom_point_order_y_location"
    display: "Custom Point Y Location"
    type: "location"
    tooltip: "Y Coordinate for Custom Point for Point Optimization Scheme"
    depends: {"AND":[{"slicing_mode":0},{"OR":[{"point_order_optimization":4},{"point_order_optimization":5}]}]}
    options: []
    default: 0
    minor: "Optimizations"
    major: "Profile"
    namespace: "Profile::Optimizations"
    symbol: "kCustomPointYLocation"
    local: true
  - name: "custom_point_order_z_location"
    display: "Custom Point Z Location"
    type: "location"
    tooltip: "Z Coordinate for Custom Point for Point Optimization Scheme"
    depends: {"AND":[{"slicing_mode":0},{"OR":[{"point_order_optimization":4},{"point_order_optimization":5}]}]}
    options: []
    default: 0
    minor: "Optimizations"
    major: "Profile"
    namespace: "Profile::Optimizations"
    symbol: "kCustomPointZLocation"
    local: true
  - name: "enable_second_custom_point_location"
    display: "Add Second Custom Location"
    type: "boolean"
    tooltip: "Enables a second custom point location so that points alternate layer to layer. The second point is used for even numbered layers."
    depends: {"AND":[{"slicing_mode":0},{"OR":[{"point_order_optimization":4},{"point_order_optimization":5}]}]}
    options: []
    default: false
    minor: "Optimizations"
    major: "Profile"
    namespace: "Profile::Optimizations"
    symbol: "kAddSecondCustomLocation"
    local: true
  - name: "enable_second_point_every_two"
    display: "Enable Second Custom Location Every Two Layers"
    type: "boolean"
    tooltip: "Enables the second custom point, but custom points are alternated every two layers. I.e. layers 1 and 2 use the original point and layers 3 and 4 use the second point."
    depends: {"AND":[{"slicing_mode":0},{"AND":[{"enable_second_custom_point_location":true},{"OR":[{"point_order_optimization":4},{"point_order_optimization":5}]}]}]}
    options: []
    default: false
    minor: "Optimizations"
    major: "Profile"
    namespace: "Profile::Optimizations"
    symbol: "kEnableSecondCustomLocationEveryTwoLayers"
    local: true
  - name: "custom_second_point_order_x_location"
    display: "Second Custom Point X Location"
    type: "location"
    tooltip: "X Coordinate for Second Custom Point for Point Optimization Scheme"
    depends: {"AND":[{"slicing_mode":0},{"AND":[{"enable_second_custom_point_location":true},{"OR":[{"point_order_optimization":4},{"point_order_optimization":5}]}]}]}
    options: []
    default: 0
    minor: "Optimizations"
    major: "Profile"
    namespace: "Profile::Optimizations"
    symbol: "kSecondCustomPointXLocation"
    local: true
  - name: "custom_second_point_order_y_location"
    display: "Second Custom Point Y Location"
    type: "location"
    tooltip: "Y Coordinate for Second Custom Point for Point Optimization Scheme"
    depends: {"AND":[{"slicing_mode":0},{"AND":[{"enable_second_custom_point_location":true},{"OR":[{"point_order_optimization":4},{"point_order_optimization":5}]}]}]}
    options: []
    default: 0
    minor: "Optimizations"
    major: "Profile"
    namespace: "Profile::Optimizations"
    symbol: "kSecondCustomPointYLocation"
    local: true
  - name: "custom_second_point_order_z_location"
    display: "Second Custom Point Z Location"
    type: "location"
    tooltip: "Z Coordinate for Second Custom Point for Point Optimization Scheme"
    depends: {"AND":[{"slicing_mode":0},{"AND":[{"enable_second_custom_point_location":true},{"OR":[{"point_order_optimization":4},{"point_order_optimization":5}]}]}]}
    options: []
    default: 0
    minor: "Optimizations"
    major: "Profile"
    namespace: "Profile::Optimizations"
    symbol: "kSecondCustomPointZLocation"
    local: true
  - name: "seam_attractor_vector_x"
    display: "Seam Attractor Vector - X"
    type: "unitless_float"
    tooltip: "X component of the vector used to project seam attractor points onto each slicing plane. A zero vector uses the slicing vector automatically."
    depends: {"AND":[{"slicing_mode":0},{"OR":[{"island_order_optimization":6},{"OR":[{"OR":[{"path_order_optimization":5},{"OR":[{"perimeter_path_order_optimization":6},{"OR":[{"inset_path_order_optimization":6},{"skin_path_order_optimization":6}]}]}]},{"OR":[{"point_order_optimization":4},{"point_order_optimization":5}]}]}]}]}
    options: []
    default: 0
    minor: "Optimizations"
    major: "Profile"
    namespace: "Profile::Optimizations"
    symbol: "kSeamAttractorVectorX"
    local: true
  - name: "seam_attractor_vector_y"
    display: "Seam Attractor Vector - Y"
    type: "unitless_float"
    tooltip: "Y component of the vector used to project seam attractor points onto each slicing plane. A zero vector uses the slicing vector automatically."
    depends: {"AND":[{"slicing_mode":0},{"OR":[{"island_order_optimization":6},{"OR":[{"OR":[{"path_order_optimization":5},{"OR":[{"perimeter_path_order_optimization":6},{"OR":[{"inset_path_order_optimization":6},{"skin_path_order_optimization":6}]}]}]},{"OR":[{"point_order_optimization":4},{"point_order_optimization":5}]}]}]}]}
    options: []
    default: 0
    minor: "Optimizations"
    major: "Profile"
    namespace: "Profile::Optimizations"
    symbol: "kSeamAttractorVectorY"
    local: true
  - name: "seam_attractor_vector_z"
    display: "Seam Attractor Vector - Z"
    type: "unitless_float"
    tooltip: "Z component of the vector used to project seam attractor points onto each slicing plane. A zero vector uses the slicing vector automatically."
    depends: {"AND":[{"slicing_mode":0},{"OR":[{"island_order_optimization":6},{"OR":[{"OR":[{"path_order_optimization":5},{"OR":[{"perimeter_path_order_optimization":6},{"OR":[{"inset_path_order_optimization":6},{"skin_path_order_optimization":6}]}]}]},{"OR":[{"point_order_optimization":4},{"point_order_optimization":5}]}]}]}]}
    options: []
    default: 0
    minor: "Optimizations"
    major: "Profile"
    namespace: "Profile::Optimizations"
    symbol: "kSeamAttractorVectorZ"
    local: true
  - name: "custom_point_order_x_increment"
    display: "Custom Point X Increment"
    type: "location"
    tooltip: "Distance to increment the custom point X location from layer to layer. This is used for angled printing to move the seam along with the slicing plane."
    depends: {"AND":[{"slicing_mode":0},{"OR":[{"point_order_optimization":4},{"point_order_optimization":5}]}]}
    options: []
    default: 0
    minor: "Optimizations"
    major: "Profile"
    namespace: "Profile::Optimizations"
    symbol: "kCustomPointXIncrement"
    local: true
  - name: "custom_point_order_y_increment"
    display: "Custom Point Y Increment"
    type: "location"
    tooltip: "Distance to increment the custom point Y location from layer to layer. This is used for angled printing to move the seam along with the slicing plane."
    depends: {"AND":[{"slicing_mode":0},{"OR":[{"point_order_optimization":4},{"point_order_optimization":5}]}]}
    options: []
    default: 0
    minor: "Optimizations"
    major: "Profile"
    namespace: "Profile::Optimizations"
    symbol: "kCustomPointYIncrement"
    local: true
inputs:
  - name: "seam_attractor_vector"
    display: "Seam Attractor Vector"
    widget: "vector3"
    tooltip: "Vector used to project seam attractor points onto each slicing plane. Leave all components at 0 to use the slicing vector automatically."
    depends: {"AND":[{"slicing_mode":0},{"OR":[{"island_order_optimization":6},{"OR":[{"OR":[{"path_order_optimization":5},{"OR":[{"perimeter_path_order_optimization":6},{"OR":[{"inset_path_order_optimization":6},{"skin_path_order_optimization":6}]}]}]},{"OR":[{"point_order_optimization":4},{"point_order_optimization":5}]}]}]}]}
    minor: "Optimizations"
    major: "Profile"
    components:
      - setting: "seam_attractor_vector_x"
        label: "X"
      - setting: "seam_attractor_vector_y"
        label: "Y"
      - setting: "seam_attractor_vector_z"
        label: "Z"
