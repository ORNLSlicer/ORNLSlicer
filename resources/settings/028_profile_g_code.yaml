# Canonical settings metadata for ORNLSlicer.
# Edit this file instead of resources/configs/master.conf.
settings:
  - name: "perimeter_start_code"
    display: "Perimeter Start G-Code"
    type: "multiline_text"
    tooltip: "Code to be executed at the start of perimeter paths"
    depends: {"AND":[{"slicing_mode":0},{"perimeter":true}]}
    options: []
    default: ""
    minor: "G-Code"
    major: "Profile"
    namespace: "Profile::GCode"
    symbol: "kPerimeterStartGCode"
    local: true
