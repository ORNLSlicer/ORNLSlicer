# Canonical settings metadata for ORNLSlicer.
# Edit this file instead of resources/configs/master.conf.
settings:
  - name: "slicing_vector_x"
    display: "Slicing Vector - X"
    type: "unitless_float"
    tooltip: "Defines the X-component of the slicing vector, which determines the orientation of the slicing plane. A vector of {1, 0, 1}, when normalized, corresponds to a 45-degree tilt about the Y-axis. A vector of {1, 0, 0} is oriented along the positive X-axis, aligning the slicing plane parallel to the YZ plane (perpendicular to the X-axis)."
    depends: {}
    options: []
    default: 0
    minor: "Slicing Vector"
    major: "Profile"
    namespace: "Profile::SlicingVector"
    symbol: "kSlicingVectorX"
    local: false
  - name: "slicing_vector_y"
    display: "Slicing Vector - Y"
    type: "unitless_float"
    tooltip: "Defines the Y-component of the slicing vector, which determines the orientation of the slicing plane. A vector of {0, 1, 1}, when normalized, corresponds to a 45-degree tilt about the X-axis. A vector of {0, 1, 0} is oriented along the positive Y-axis, aligning the slicing plane parallel to the XZ plane (perpendicular to the Y-axis)."
    depends: {}
    options: []
    default: 0
    minor: "Slicing Vector"
    major: "Profile"
    namespace: "Profile::SlicingVector"
    symbol: "kSlicingVectorY"
    local: false
  - name: "slicing_vector_z"
    display: "Slicing Vector - Z"
    type: "unitless_float"
    tooltip: "Defines the Z-component of the slicing vector, which determines the orientation of the slicing plane. A vector of {0, 0, 1} is oriented along the positive Z-axis, aligning the slicing plane parallel to the XY plane (perpendicular to the Z-axis)."
    depends: {}
    options: []
    default: 1
    minor: "Slicing Vector"
    major: "Profile"
    namespace: "Profile::SlicingVector"
    symbol: "kSlicingVectorZ"
    local: false
