# Canonical settings metadata for ORNLSlicer.
# Edit this file instead of resources/configs/master.conf.
settings:
  - name: "enable_dynamic_acceleration"
    display: "Enable Dynamic Acceleration"
    type: "boolean"
    tooltip: "If selected, machine acceleration will be changed throughout the G-Code"
    depends: {"OR":[{"syntax":1},{"syntax":11}]}
    options: []
    default: false
    minor: "Acceleration"
    major: "Printer"
    namespace: "Printer::Acceleration"
    symbol: "kEnableDynamicAcceleration"
    local: false
  - name: "default_acceleration"
    display: "Default Acceleration"
    type: "accel"
    tooltip: "Default acceleration value"
    depends: {"enable_dynamic_acceleration":true}
    options: []
    default: 0
    minor: "Acceleration"
    major: "Printer"
    namespace: "Printer::Acceleration"
    symbol: "kDefaultAcceleration"
    local: false
