# Canonical settings metadata for ORNLSlicer.
# Edit this file instead of resources/configs/master.conf.
settings:
  - name: "cross_section_largest_gap"
    display: "Largest Gap Distance"
    type: "distance"
    tooltip: "Sets the primary endpoint-gap tolerance used to connect adjacent cross-section segments. Endpoints closer than this distance are treated as neighbors and joined."
    depends: {}
    options: []
    default: 2540
    minor: "Cross-Sectioning"
    major: "Experimental"
    namespace: "Experimental::CrossSectioning"
    symbol: "kLargestGapDistance"
    local: false
  - name: "max_stitch_distance"
    display: "Max Stitch Distance"
    type: "distance"
    tooltip: "Sets the larger fallback stitching tolerance used when primary gap connection still leaves open cross-section polylines. Remaining endpoints closer than this distance are joined during healing."
    depends: {}
    options: []
    default: 25400
    minor: "Cross-Sectioning"
    major: "Experimental"
    namespace: "Experimental::CrossSectioning"
    symbol: "kMaxStitchDistance"
    local: false
