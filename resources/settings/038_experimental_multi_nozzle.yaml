# Canonical settings metadata for ORNLSlicer.
# Edit this file instead of resources/configs/master.conf.
settings:
  - name: "enable_multi_nozzle"
    display: "Enable Multiple Nozzles"
    type: "boolean"
    tooltip: "Enables options for experimental multi-nozzle features"
    depends: {}
    options: []
    default: false
    minor: "Multi-Nozzle"
    major: "Experimental"
    namespace: "Experimental::MultiNozzle"
    symbol: "kEnableMultipleNozzles"
    local: false
  - name: "nozzle_count"
    display: "Number of Nozzles"
    type: "positive_int"
    tooltip: "The number of nozzles available"
    depends: {"enable_multi_nozzle":true}
    options: []
    default: 1
    minor: "Multi-Nozzle"
    major: "Experimental"
    namespace: "Experimental::MultiNozzle"
    symbol: "kNumberofNozzles"
    local: false
  - name: "nozzle_offset_x"
    display: "Nozzle Offset X"
    type: "distance"
    tooltip: "X-Distance of Nozzle Offset"
    depends: {"enable_multi_nozzle":true}
    options: []
    default: 0
    minor: "Multi-Nozzle"
    major: "Experimental"
    namespace: "Experimental::MultiNozzle"
    symbol: "kNozzleOffsetX"
    local: false
  - name: "nozzle_offset_y"
    display: "Nozzle Offset Y"
    type: "distance"
    tooltip: "Y-Distance of Nozzle Offset"
    depends: {"enable_multi_nozzle":true}
    options: []
    default: 0
    minor: "Multi-Nozzle"
    major: "Experimental"
    namespace: "Experimental::MultiNozzle"
    symbol: "kNozzleOffsetY"
    local: false
  - name: "nozzle_offset_z"
    display: "Nozzle Offset Z"
    type: "distance"
    tooltip: "Z-Distance of Nozzle Offset"
    depends: {"enable_multi_nozzle":true}
    options: []
    default: 0
    minor: "Multi-Nozzle"
    major: "Experimental"
    namespace: "Experimental::MultiNozzle"
    symbol: "kNozzleOffsetZ"
    local: false
  - name: "nozzle_material"
    display: "Nozzle Material"
    type: "number"
    tooltip: "Material type used in nozzle"
    depends: {"enable_multi_nozzle":true}
    options: []
    default: 0
    minor: "Multi-Nozzle"
    major: "Experimental"
    namespace: "Experimental::MultiNozzle"
    symbol: "kNozzleMaterial"
    local: false
  - name: "enable_mutli_nozzle_multi_material"
    display: "Enable Multiple Nozzles with Multi-Material"
    type: "boolean"
    tooltip: "If selected, segments of different materials will be printed with different nozzles"
    depends: {"AND":[{"enable_multi_nozzle":true},{"AND":[{"NOT":[{"nozzle_count":1}]},{"enable_multi_material":true}]}]}
    options: []
    default: false
    minor: "Multi-Nozzle"
    major: "Experimental"
    namespace: "Experimental::MultiNozzle"
    symbol: "kEnableMultipleNozzleswithMultiMaterial"
    local: false
  - name: "enable_duplicate_path_removal"
    display: "Remove Duplicate Paths"
    type: "boolean"
    tooltip: "Removes duplicate paths if the paths can be printed simultaneously by multiple nozzles"
    depends: {"AND":[{"enable_multi_nozzle":true},{"NOT":[{"nozzle_count":1}]}]}
    options: []
    default: false
    minor: "Multi-Nozzle"
    major: "Experimental"
    namespace: "Experimental::MultiNozzle"
    symbol: "kRemoveDuplicatePaths"
    local: false
  - name: "duplicate_path_similarity"
    display: "Duplicate Path Similarity"
    type: "percentage100"
    tooltip: "Percent similarity required for paths to be considered duplicates"
    depends: {"AND":[{"enable_multi_nozzle":true},{"enable_duplicate_path_removal":true}]}
    options: []
    default: 98
    minor: "Multi-Nozzle"
    major: "Experimental"
    namespace: "Experimental::MultiNozzle"
    symbol: "kDuplicatePathSimilarity"
    local: false
  - name: "enable_indpendent_nozzles"
    display: "Enable Independent Nozzles"
    type: "boolean"
    tooltip: "Enables optimizations for multiple independent extruders"
    depends: {"enable_multi_nozzle":true}
    options: []
    default: false
    minor: "Multi-Nozzle"
    major: "Experimental"
    namespace: "Experimental::MultiNozzle"
    symbol: "kEnableIndependentNozzles"
    local: false
  - name: "independent_nozzle_optimizer"
    display: "Independent Nozzle Assignment Method"
    type: "enumeration"
    tooltip: "Method to use for assigning islands to nozzles"
    depends: {"AND":[{"enable_multi_nozzle":true},{"enable_indpendent_nozzles":true}]}
    options:
      - "X Location"
      - "Y Location"
      - "Area"
    default: 0
    minor: "Multi-Nozzle"
    major: "Experimental"
    namespace: "Experimental::MultiNozzle"
    symbol: "kIndependentNozzleAssignmentMethod"
    local: false
