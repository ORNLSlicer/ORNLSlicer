# Canonical settings metadata for ORNLSlicer.
# Edit this file instead of resources/configs/master.conf.
settings:
  - name: "skeleton"
    display: "Enable Skeletons"
    type: "boolean"
    tooltip: "If selected, skeletons will allow for an open loop path to fill a space that is too thin to use concentric paths"
    depends: {"slicing_mode":0}
    options: []
    default: false
    minor: "Skeleton"
    major: "Profile"
    namespace: "Profile::Skeleton"
    symbol: "kEnableSkeletons"
    local: true
  - name: "skeleton_input"
    display: "Input Geometry"
    type: "enumeration"
    tooltip: "Specifies how the bounding geometry is provided to the Skeleton Voronoi Diagram generator. The geometry is fed into the generator as either segments or points. This input method influences how the skeleton paths are constructed."
    depends: {"AND":[{"slicing_mode":0},{"skeleton":true}]}
    options:
      - "SEGMENT"
      - "POINT"
    default: 0
    minor: "Skeleton"
    major: "Profile"
    namespace: "Profile::Skeleton"
    symbol: "kInputGeometry"
    local: true
  - name: "skeleton_input_cleaning_distance"
    display: "Input Cleaning Distance"
    type: "distance"
    tooltip: "Specifies the distance threshold used to clean and simplify the input geometry before generating the skeleton. The cleaning process involves: Removing vertices that connect co-linear or nearly co-linear edges: If moving a vertex by no more than this distance would make the connected edges co-linear, the vertex is removed to simplify the geometry. Eliminating vertices that are too close to adjacent vertices: Vertices within this distance of an adjacent vertex are removed to prevent redundant points and overlaps. Removing vertices near semi-adjacent vertices along with their outlying vertices: If a vertex is within this distance of a semi-adjacent vertex, both the vertex and its connected outlying vertices are removed to simplify complex connections. By adjusting this cleaning distance, you can optimize the input geometry by merging or removing unnecessary vertices. This leads to improved accuracy and performance of the skeleton generation process, resulting in cleaner and more efficient skeleton paths."
    depends: {"AND":[{"slicing_mode":0},{"skeleton":true}]}
    options: []
    default: 0
    minor: "Skeleton"
    major: "Profile"
    namespace: "Profile::Skeleton"
    symbol: "kInputCleaningDistance"
    local: true
  - name: "skeleton_input_chamfering_angle"
    display: "Input Chamfering Angle"
    type: "angle"
    tooltip: "Specifies the angle threshold used to chamfer (flatten) sharp corners in the input geometry during skeleton generation. Corners with internal angles less than this value will be automatically chamfered to smooth out acute angles. This chamfering process helps to simplify the geometry, improving the accuracy of the skeleton pruning process."
    depends: {"AND":[{"slicing_mode":0},{"skeleton":true}]}
    options: []
    default: 0
    minor: "Skeleton"
    major: "Profile"
    namespace: "Profile::Skeleton"
    symbol: "kInputChamferingAngle"
    local: true
  - name: "skeleton_output_cleaning_distance"
    display: "Output Cleaning Distance"
    type: "distance"
    tooltip: "Specifies the distance threshold used to clean and simplify the the generated skeleton. The cleaning process involves: Removing vertices that connect co-linear or nearly co-linear edges: If moving a vertex by no more than this distance would make the connected edges co-linear, the vertex is removed to simplify the skeleton. Eliminating vertices that are too close to adjacent vertices: Vertices within this distance of an adjacent vertex are removed to prevent redundant points and overlaps. Removing vertices near semi-adjacent vertices along with their outlying vertices: If a vertex is within this distance of a semi-adjacent vertex, both the vertex and its connected outlying vertices are removed to simplify complex connections. By adjusting this cleaning distance, you can simplify the skeleton by merging or removing unnecessary vertices."
    depends: {"AND":[{"slicing_mode":0},{"skeleton":true}]}
    options: []
    default: 0
    minor: "Skeleton"
    major: "Profile"
    namespace: "Profile::Skeleton"
    symbol: "kOutputCleaningDistance"
    local: true
  - name: "skeleton_pruning_mode"
    display: "Pruning Mode"
    type: "enumeration"
    tooltip: "Specifies the optional graph pruning method used after generating the skeleton Voronoi graph. Vanishing Angle removes low-significance branch trees while preserving skeleton topology."
    depends: {"skeleton":true}
    options:
      - "NONE"
      - "VANISHING_ANGLE"
    default: 0
    minor: "Skeleton"
    major: "Profile"
    namespace: "Profile::Skeleton"
    symbol: "kPruningMode"
    local: true
  - name: "skeleton_vanishing_angle_threshold"
    display: "Vanishing Angle Threshold"
    type: "angle"
    tooltip: "Prunes skeleton branch trees whose Vanishing Angle is below this threshold. Lower values preserve more rounded features; higher values remove more noise."
    depends: {"AND":[{"skeleton":true},{"skeleton_pruning_mode":1}]}
    options: []
    default: 0.872665
    minor: "Skeleton"
    major: "Profile"
    namespace: "Profile::Skeleton"
    symbol: "kVanishingAngleThreshold"
    local: true
  - name: "skeleton_width"
    display: "Bead Width"
    type: "distance"
    tooltip: "Bead width for skeleton paths."
    depends: {"AND":[{"slicing_mode":0},{"skeleton":true}]}
    options: []
    default: 0
    minor: "Skeleton"
    major: "Profile"
    namespace: "Profile::Skeleton"
    symbol: "kBeadWidth"
    local: true
  - name: "skeleton_speed"
    display: "Speed"
    type: "speed"
    tooltip: "Speed of skeleton printing paths."
    depends: {"AND":[{"slicing_mode":0},{"skeleton":true}]}
    options: []
    default: 0
    minor: "Skeleton"
    major: "Profile"
    namespace: "Profile::Skeleton"
    symbol: "kSpeed"
    local: true
  - name: "skeleton_extruder_speed"
    display: "Extruder Speed"
    type: "rpm"
    tooltip: "Extruder speed for skeletons."
    depends: {"AND":[{"slicing_mode":0},{"AND":[{"skeleton":true},{"AND":[{"enable_width_height":false},{"OR":[{"machine_type":0},{"OR":[{"machine_type":4},{"machine_type":5}]}]}]}]}]}
    options: []
    default: 0
    minor: "Skeleton"
    major: "Profile"
    namespace: "Profile::Skeleton"
    symbol: "kExtruderSpeed"
    local: true
  - name: "skeleton_extrusion_multiplier"
    display: "Extrusion Multiplier"
    type: "unitless_float"
    tooltip: "Extrusion multiplier to increase/decrease flowrate for skeleton paths for systems without RPM control."
    depends: {"AND":[{"slicing_mode":0},{"AND":[{"skeleton":true},{"OR":[{"machine_type":1},{"syntax":26}]}]}]}
    options: []
    default: 1
    minor: "Skeleton"
    major: "Profile"
    namespace: "Profile::Skeleton"
    symbol: "kExtrusionMultiplier"
    local: true
  - name: "skeleton_adapt"
    display: "Enable Adaptive Bead Widths"
    type: "boolean"
    tooltip: "If selected, skeleton bead widths will dynamically adjust to better fill their surrounding regions, minimizing both under- and over-filling. This adaptation is achieved by inversely adjusting the speed relative to the desired bead width using the formula: Adjusted Speed = (Reference Speed \u00d7 Reference Bead Width) / Desired Bead Width. When wider bead widths are needed to fill larger areas, the traversal speed decreases, allowing more material to be deposited. Conversely, in tighter spaces requiring narrower bead widths, the speed increases, depositing less material."
    depends: {"AND":[{"slicing_mode":0},{"skeleton":true}]}
    options: []
    default: false
    minor: "Skeleton"
    major: "Profile"
    namespace: "Profile::Skeleton"
    symbol: "kEnableAdaptiveBeadWidths"
    local: true
  - name: "skeleton_adapt_step_size"
    display: "Adaptivity Step Size"
    type: "distance"
    tooltip: "Specifies the distance used to divide skeleton segments into smaller subsegments for adaptive bead width adjustment. A smaller step size allows for finer adaptation to geometric variations."
    depends: {"AND":[{"slicing_mode":0},{"AND":[{"skeleton":true},{"skeleton_adapt":true}]}]}
    options: []
    default: 1
    minor: "Skeleton"
    major: "Profile"
    namespace: "Profile::Skeleton"
    symbol: "kAdaptivityStepSize"
    local: true
  - name: "skeleton_adapt_min_width"
    display: "Minimum Adaptive Bead Width"
    type: "distance"
    tooltip: "Specifies the minimum allowable bead width for adaptive skeletons. Skeletons with adapted bead widths less than this value will be removed."
    depends: {"AND":[{"slicing_mode":0},{"AND":[{"skeleton":true},{"skeleton_adapt":true}]}]}
    options: []
    default: 0
    minor: "Skeleton"
    major: "Profile"
    namespace: "Profile::Skeleton"
    symbol: "kMinimumAdaptiveBeadWidth"
    local: true
  - name: "skeleton_adapt_min_width_filter"
    display: "Minimum Adaptive Bead Width Filter"
    type: "enumeration"
    tooltip: "Specifies how to handle adaptive skeleton segments with bead widths below the minimum threshold. Clamp: Assigns the minimum bead width to segments with adapted widths below the threshold. Prune: Removes segments with adapted widths below the threshold."
    depends: {"AND":[{"slicing_mode":0},{"AND":[{"skeleton":true},{"skeleton_adapt":true}]}]}
    options:
      - "CLAMP"
      - "PRUNE"
    default: 0
    minor: "Skeleton"
    major: "Profile"
    namespace: "Profile::Skeleton"
    symbol: "kMinimumAdaptiveSkeletonBeadWidthFilter"
    local: true
  - name: "skeleton_adapt_max_width"
    display: "Maximum Adaptive Bead Width"
    type: "distance"
    tooltip: "Specifies the maximum allowable bead width for adaptive skeletons. Skeletons with adapted bead widths greater than this value will be assigned this value as their bead width."
    depends: {"AND":[{"slicing_mode":0},{"AND":[{"skeleton":true},{"skeleton_adapt":true}]}]}
    options: []
    default: 10000
    minor: "Skeleton"
    major: "Profile"
    namespace: "Profile::Skeleton"
    symbol: "kMaximumAdaptiveBeadWidth"
    local: true
  - name: "skeleton_adapt_max_width_filter"
    display: "Maximum Adaptive Bead Width Filter"
    type: "enumeration"
    tooltip: "Specifies how to handle adaptive skeleton segments with bead widths above the maximum threshold. Clamp: Assigns the maximum bead width to segments with adapted widths above the threshold. Prune: Removes segments with adapted widths above the threshold."
    depends: {"AND":[{"slicing_mode":0},{"AND":[{"skeleton":true},{"skeleton_adapt":true}]}]}
    options:
      - "CLAMP"
      - "PRUNE"
    default: 0
    minor: "Skeleton"
    major: "Profile"
    namespace: "Profile::Skeleton"
    symbol: "kMaximumAdaptiveBeadWidthFilter"
    local: true
  - name: "skeleton_minimum_path_length"
    display: "Minimum Path Length"
    type: "distance"
    tooltip: "Skeleton extrusion paths whose length is less than this value are removed."
    depends: {"AND":[{"slicing_mode":0},{"skeleton":true}]}
    options: []
    default: 0
    minor: "Skeleton"
    major: "Profile"
    namespace: "Profile::Skeleton"
    symbol: "kMinimumPathLength"
    local: true
  - name: "skeleton_minimum_segment_length"
    display: "Minimum Skeleton Segment Length"
    type: "distance"
    tooltip: "Skeleton path segments shorter than this value are collapsed before extrusion paths are created."
    depends: {"AND":[{"slicing_mode":0},{"skeleton":true}]}
    options: []
    default: 0
    minor: "Skeleton"
    major: "Profile"
    namespace: "Profile::Skeleton"
    symbol: "kMinimumSkeletonSegmentLength"
    local: true
  - name: "skeleton_prestart"
    display: "Enable Skeleton Prestart"
    type: "boolean"
    tooltip: "If selected, a prestart motion is added to the front of the skeleton to give it more time to deposit material. This prestart is along the same vector as the first segment of the skeleton."
    depends: {"AND":[{"slicing_mode":0},{"skeleton":true}]}
    options: []
    default: false
    minor: "Skeleton"
    major: "Profile"
    namespace: "Profile::Skeleton"
    symbol: "kEnableSkeletonPrestart"
    local: true
  - name: "skeleton_prestart_distance"
    display: "Skeleton Prestart Distance"
    type: "distance"
    tooltip: "Length of the skeleton prestart move."
    depends: {"AND":[{"slicing_mode":0},{"AND":[{"skeleton":true},{"skeleton_prestart":true}]}]}
    options: []
    default: 0
    minor: "Skeleton"
    major: "Profile"
    namespace: "Profile::Skeleton"
    symbol: "kSkeletonPrestartDistance"
    local: true
  - name: "skeleton_prestart_speed"
    display: "Skeleton Prestart Speed"
    type: "speed"
    tooltip: "Speed of skeleton prestart paths."
    depends: {"AND":[{"slicing_mode":0},{"AND":[{"skeleton":true},{"skeleton_prestart":true}]}]}
    options: []
    default: 0
    minor: "Skeleton"
    major: "Profile"
    namespace: "Profile::Skeleton"
    symbol: "kSkeletonPrestartSpeed"
    local: true
  - name: "skeleton_prestart_extruder_speed"
    display: "Skeleton Prestart Extruder Speed"
    type: "rpm"
    tooltip: "Extruder speed for skeleton prestart paths."
    depends: {"AND":[{"slicing_mode":0},{"AND":[{"skeleton":true},{"skeleton_prestart":true}]}]}
    options: []
    default: 0
    minor: "Skeleton"
    major: "Profile"
    namespace: "Profile::Skeleton"
    symbol: "kSkeletonPrestartExtruderSpeed"
    local: true
  - name: "skeleton_prestart_area_modifier"
    display: "Skeleton Prestart Bead Area Modifier"
    type: "percentage"
    tooltip: "Percent multiplier for bead area of skeleton prestart paths."
    depends: {"AND":[{"slicing_mode":0},{"AND":[{"skeleton":true},{"skeleton_prestart":true}]}]}
    options: []
    default: 100
    minor: "Skeleton"
    major: "Profile"
    namespace: "Profile::Skeleton"
    symbol: "kSkeletonPrestartBeadAreaModifier"
    local: true
  - name: "skeleton_skin_mcode"
    display: "Use Skin M-Code for Skeletons"
    type: "boolean"
    tooltip: "If selected, the skin m-code override (M15) will be issued rather than the default inset m-code override (M13) on BAAM."
    depends: {"AND":[{"slicing_mode":0},{"skeleton":true}]}
    options: []
    default: false
    minor: "Skeleton"
    major: "Profile"
    namespace: "Profile::Skeleton"
    symbol: "kUseSkinMCodeforSkeletons"
    local: false
